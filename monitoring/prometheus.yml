# Prometheus Configuration for Guitar Stage2 v3 Monitoring

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'guitar-v3-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Rule files
rule_files:
  - '/etc/prometheus/rules/guitar_v3_alerts.yml'
  - '/etc/prometheus/rules/guitar_v3_latency_alerts.yml'
  - '/etc/prometheus/rules/guitar_shadow_alerts.yml'

# Scrape configurations
scrape_configs:
  # Guitar v3 KPI metrics (file-based)
  - job_name: 'guitar_v3_kpi'
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - '/var/lib/prometheus/filesd/guitar_v3_kpi.json'
    
  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          alias: 'guitar-v3-host'
