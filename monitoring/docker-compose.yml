version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: guitar_v3_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./guitar_v3_alerts.yml:/etc/prometheus/rules/guitar_v3_alerts.yml
      - ./prometheus/alerts/guitar_v3_latency_alerts.yml:/etc/prometheus/rules/guitar_v3_latency_alerts.yml
      - ./prometheus/alerts/guitar_shadow_alerts.yml:/etc/prometheus/rules/guitar_shadow_alerts.yml
      - ./filesd:/var/lib/prometheus/filesd
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: guitar_v3_alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: guitar_v3_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_dashboard.json:/etc/grafana/dashboards/guitar_v3.json
      - ./grafana_shadow_dashboard.json:/etc/grafana/dashboards/guitar_shadow.json
      - ./grafana_provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
