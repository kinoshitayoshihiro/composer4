groups:
  - name: guitar_v3_latency
    interval: 30s
    rules:
      # === Critical: p95 > 150ms ===
      - alert: GuitarV3HighLatencyP95Critical
        expr: guitar_v3_latency_seconds{quantile="0.95"} > 0.150
        for: 5m
        labels:
          severity: critical
          component: guitar_stage2_v3
          metric: latency_p95
        annotations:
          summary: "Guitar v3 critical latency degradation (p95 > 150ms)"
          description: |
            p95 latency has exceeded critical threshold of 150ms.
            Current value: {{ $value | humanizeDuration }}
            This indicates severe performance degradation.
            
            Immediate actions:
            1. Check system resources (CPU/Memory)
            2. Review recent deployments
            3. Analyze slow query logs
            4. Consider rolling back if recent change
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"
          runbook: "https://wiki.internal/runbooks/guitar-v3-latency"

      # === Warning: p95 > 100ms ===
      - alert: GuitarV3HighLatencyP95Warning
        expr: guitar_v3_latency_seconds{quantile="0.95"} > 0.100
        for: 10m
        labels:
          severity: warning
          component: guitar_stage2_v3
          metric: latency_p95
        annotations:
          summary: "Guitar v3 elevated latency (p95 > 100ms)"
          description: |
            p95 latency has exceeded warning threshold of 100ms.
            Current value: {{ $value | humanizeDuration }}
            
            Recommended actions:
            1. Monitor for further degradation
            2. Check application logs for errors
            3. Review resource utilization trends
            4. Prepare rollback plan if needed
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"

      # === Critical: p99 > 300ms ===
      - alert: GuitarV3HighLatencyP99Critical
        expr: guitar_v3_latency_seconds{quantile="0.99"} > 0.300
        for: 5m
        labels:
          severity: critical
          component: guitar_stage2_v3
          metric: latency_p99
        annotations:
          summary: "Guitar v3 very high tail latency (p99 > 300ms)"
          description: |
            p99 latency has exceeded critical threshold of 300ms.
            Current value: {{ $value | humanizeDuration }}
            This affects 1% of requests (worst case scenarios).
            
            Immediate actions:
            1. Identify slow requests in logs
            2. Check for outlier patterns (song complexity, tempo, etc.)
            3. Review ML model inference times
            4. Consider timeout adjustments
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"

      # === Warning: p99 > 200ms ===
      - alert: GuitarV3HighLatencyP99Warning
        expr: guitar_v3_latency_seconds{quantile="0.99"} > 0.200
        for: 10m
        labels:
          severity: warning
          component: guitar_stage2_v3
          metric: latency_p99
        annotations:
          summary: "Guitar v3 elevated tail latency (p99 > 200ms)"
          description: |
            p99 latency has exceeded warning threshold of 200ms.
            Current value: {{ $value | humanizeDuration }}
            
            Recommended actions:
            1. Monitor p99 trend
            2. Analyze slow request patterns
            3. Review cache hit rates
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"

      # === Warning: Slow Request (individual) ===
      - alert: GuitarV3SlowRequest
        expr: |
          (
            guitar_v3_latency_seconds_sum / guitar_v3_latency_seconds_count
          ) > 0.500
        for: 1m
        labels:
          severity: warning
          component: guitar_stage2_v3
          metric: latency_max
        annotations:
          summary: "Guitar v3 slow request detected (>500ms)"
          description: |
            Individual request(s) exceeded 500ms.
            Average latency: {{ $value | humanizeDuration }}
            
            This may indicate:
            - Complex song patterns requiring optimization
            - ML model cold start
            - Resource contention
            
            Actions:
            1. Check recent request logs
            2. Identify specific slow cases
            3. Consider pattern caching
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"

      # === Warning: Latency Regression (vs 1h ago) ===
      - alert: GuitarV3LatencyRegression
        expr: |
          (
            (
              guitar_v3_latency_seconds{quantile="0.95"}
              - guitar_v3_latency_seconds{quantile="0.95"} offset 1h
            ) / guitar_v3_latency_seconds{quantile="0.95"} offset 1h
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          component: guitar_stage2_v3
          metric: latency_regression
        annotations:
          summary: "Guitar v3 latency regression detected (>50% vs 1h ago)"
          description: |
            p95 latency has increased by more than 50% compared to 1 hour ago.
            Current p95: {{ $value | humanizeDuration }}
            
            This suggests performance degradation over time.
            
            Possible causes:
            - Recent deployment causing slowdown
            - Gradual resource leak (memory, connections, etc.)
            - Increased load or complexity
            - Cache eviction or warming issues
            
            Actions:
            1. Compare current vs previous hour metrics
            2. Check for recent changes (deployments, config)
            3. Review system resource trends
            4. Consider rollback if deployment-related
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"

      # === Info: Latency Improvement ===
      - alert: GuitarV3LatencyImprovement
        expr: |
          (
            (
              guitar_v3_latency_seconds{quantile="0.95"} offset 1h
              - guitar_v3_latency_seconds{quantile="0.95"}
            ) / guitar_v3_latency_seconds{quantile="0.95"} offset 1h
          ) > 0.3
        for: 15m
        labels:
          severity: info
          component: guitar_stage2_v3
          metric: latency_improvement
        annotations:
          summary: "Guitar v3 latency improved (>30% vs 1h ago)"
          description: |
            p95 latency has improved by more than 30% compared to 1 hour ago.
            Current p95: {{ $value | humanizeDuration }}
            
            This is good news! Recent changes may have improved performance.
            
            Actions:
            1. Document what changed for future reference
            2. Monitor for stability
            3. Consider applying similar optimizations elsewhere
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"

      # === Warning: High Latency Variance ===
      - alert: GuitarV3HighLatencyVariance
        expr: |
          (
            guitar_v3_latency_seconds{quantile="0.99"}
            - guitar_v3_latency_seconds{quantile="0.5"}
          ) > 0.100
        for: 10m
        labels:
          severity: warning
          component: guitar_stage2_v3
          metric: latency_variance
        annotations:
          summary: "Guitar v3 high latency variance (p99-p50 > 100ms)"
          description: |
            Large gap between p99 and p50 latency detected.
            p99-p50 difference: {{ $value | humanizeDuration }}
            
            This indicates inconsistent performance.
            
            Possible causes:
            - Some patterns much slower than others
            - Sporadic resource contention
            - Cache misses for specific cases
            - ML model variability
            
            Actions:
            1. Analyze latency distribution
            2. Identify slow pattern characteristics
            3. Consider pattern-specific optimizations
            4. Review cache effectiveness
          dashboard: "http://localhost:3000/d/guitar-v3-kpi"
