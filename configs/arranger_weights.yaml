version: 1
retrieval:
  # 全体のTop-Kサンプリング設定
  topk_k: 5           # 候補数（セクションで上書き可）
  softmax_tau: 0.35   # τ（温度）。小さいほど自信の高い候補に集中
  weights:            # 総合スコアの重み（合計=1.0に正規化済み）
    tempo:   0.40
    family:  0.35
    density: 0.15
    swing:   0.10

section_overrides:    # セクションごとのTop-K/τ上書き例
  intro:   { topk_k: 3, softmax_tau: 0.25 }  # 安定重視
  verse:   { topk_k: 4, softmax_tau: 0.30 }
  chorus:  { topk_k: 5, softmax_tau: 0.30 }  # コーラスは"映え"重視だが揺らしすぎない
  bridge:  { topk_k: 5, softmax_tau: 0.45 }  # 実験的にOK
  outro:   { topk_k: 3, softmax_tau: 0.25 }

heuristics:
  bass:
    prefer_root_on_downbeat: true
    octave_default: 2
    walk_up_prob: 0.15
    approach_tone_prob: 0.10
    sustain_on_end_of_phrase: true
    # セクション別の密度係数
    density_scale:
      intro: 0.7
      verse: 1.0
      chorus: 1.2
      bridge: 1.1
      outro: 0.6
  guitar:
    strum_pattern: "downup_8ths"  # 例: down_8ths, downup_8ths, funk_16ths
    mute_ratio: 0.25
    accent_on: [1, 3]              # 4/4 のダウンビート強調
    arpeggiate_prob: 0.10
    # chord変化時の強制アクセント（最終調整：有効化）
    accent_on_chord_change: true
  piano:
    voicing_style: "close"         # close / drop2 / spread
    add9_prob: 0.20
    sus4_prob: 0.10
    pedal_threshold: 0.50           # legato_ratio でON/OFF（最終調整：0.55→0.50、発火しやすく）
    # セクション別ボイシング
    voicing_by_section:
      verse:  "close"
      chorus: "spread"
      bridge: "drop2"
  strings:
    layer_roles: [violin, viola, cello]
    unison_prob: 0.30
    octave_doubling_prob: 0.25
    long_short_mix: 0.20           # サスティンとショートの混合比
    # ダイナミクス係数（最終調整）
    dynamics_scale:
      intro: 0.8
      chorus: 1.3  # 最終調整：1.2→1.3

# Stem WAV + ChordMap ハイブリッド統合設定（Phase 1）
stems:
  use_stems: true
  # Drums特徴統合
  drums:
    density_boost: 0.8   # Stem由来hat_density混合率（0.6→0.8でdensity fail削減）
    fill_boost: 0.5      # fill_likelihood/vocal_stress優先加点（0.3→0.5で強化）
    
    # HH表情付け（Phase E: 人間味強化、最終調整）
    hh_variation:
      alternation_prob: 0.2     # 42(Closed HH) と 44(Pedal HH) を交互化する確率
      open_hint_prob: 0.1       # chorus で 46(Open HH) を追加する確率（最大1発/小節）
      choke_on_snare:
        enable: true            # backbeat直前のHHを"抜く"感じ（スティックの実際の動き）
        early_ms: 17            # オンセットを少し前に（-17ms、最終調整：+2ms）
        shorten_ms: 20          # 長さを少し短く（-20ms）
  # Piano特徴統合
  piano:
    loudness_blend: 0.5  # Stem由来energy_curve混合率（bars vs stem）
  # Strings特徴統合
  strings:
    loudness_blend: 0.6  # Stem由来energy_curve混合率（bars vs stem）

# バックエンド選択フラグ（段階導入）
# Phase A: madmom（beats/downbeats）+ 帯域限定hat_density
# Phase B: YAMNet（hat_density）+ pyloudnorm（LUFS）
# Phase C: Chordino/Essentia（chords/key）
# Phase D-E: Essentia HPCP + jSymbolic + mir_eval（probe_only運用）
features_backend:
  beats: madmom        # librosa | madmom
  downbeats: madmom    # none | librosa | madmom
  hat_density: yamnet  # librosa | librosa_enhanced | yamnet | panns ← Phase B有効化
  loudness: pyloudnorm # rms | pyloudnorm | essentia
  chords: probe_only   # probe_only | chordmap_only | chordino | essentia ← Phase D準備（probe_only=既存パイプライン影響なし）
  chroma: essentia     # librosa_enhanced | essentia ← Phase D準備（手動検証用）

  # ==== HAT DENSITY knobs (最終調整版) ====
  hat_density_params:
    backend: yamnet

    # --- YAMNet ---
    yamnet:
      classes: ["Hi-hat", "Ride cymbal", "Cymbal"]
      # グローバル下限（保険）。クラス別が優先される
      conf_threshold: 0.20
      frame_hop_sec: 0.32         # ← 時間解像度（小節単位で十分）
      aggregate: "sum"            # sum | mean
      bar_smooth_bars: 1
      
      # 追加: クラス別感度（Hi-hatを最も敏感、Ride/Cymbalはやや堅め）
      per_class_thresholds:
        "Hi-hat": 0.18
        "Ride cymbal": 0.22
        "Cymbal": 0.24

    # --- librosa_enhanced ---
    librosa_enhanced:
      hp_cut_hz: 5000
      lp_cut_hz: 12000
      hop_ms: 10
      peak_prominence: 0.05
      rms_floor_db: -60
      aggregate: "rate"
      bar_smooth_bars: 1

  # ==== ENERGY 正規化ノブ（最終調整版） ====
  normalization:
    energy_curve:
      method: "percentile"
      p_low: 5
      p_high: 97
      # "常時そこそこ元気"を維持しつつ山谷を残す
      target_range: [0.30, 1.00]
      # 拍頭のガタつきを抑えてフレーズ単位で推移
      bar_smooth_bars: 3
      # 🆕 帯域別ウェイト（楽器別activity用）
      band_weights:
        - [80,   250,  0.60]   # Bass/Guitar低域
        - [250,  2000, 1.00]   # Guitar/Keys中域（重視）
        - [2000, 6000, 0.80]   # 存在感

    hat_density:
      method: "minmax"
      clip_to: [0.0, 5.0]
      bar_smooth_bars: 1

  # ==== DRUMS ACTIVE（ヒステリシス、チラつき防止） ====
  drums_active:
    hysteresis: [0.10, 0.16]      # ← ON/OFF閾値（Lively: 緩め）
    min_active_len_bars: 2
    active_energy: 0.55           # 🆕 energy_curve閾値（drums_active = hat × energy > thresh）
  
  # 🆕 楽器別activity（帯域フィルタベース、Other stemから近似）
  instrument_activity:
    # Guitar: 1.8-4.8kHz帯域エネルギー（ChatGPT推奨）
    guitar:
      band_low: 1800
      band_high: 4800
      threshold: 0.35      # 正規化後閾値
      smooth_bars: 3       # 3bar移動平均（点滅抑制）
    # Piano: 280-3.8kHz帯域エネルギー（ChatGPT推奨）
    piano:
      band_low: 280
      band_high: 3800
      threshold: 0.40      # 正規化後閾値
      smooth_bars: 3       # 3bar移動平均（点滅抑制）
    # Strings: 450-7kHz帯域エネルギー（ChatGPT推奨）
    strings:
      band_low: 450
      band_high: 7000
      threshold: 0.45      # 正規化後閾値
      smooth_bars: 3       # 3bar移動平均（点滅抑制）
  
  # madmom設定
  madmom:
    fps: 100           # 時間分解能（Hz）
    beats_per_bar: [3, 4]  # 3/4, 4/4対応
  
  # YAMNet設定（Phase B）
  yamnet:
    threshold: 0.3     # Hi-hat確率閾値
    target_classes: ["Hi-hat", "Cymbal"]  # AudioSetクラス
  
  # 拍子一般化（Phase E: 非4/4対応）
  time_signature:
    default_numerator: 4     # bars.parquet欠損時のフォールバック
    default_denominator: 4
    support_variable: true   # 可変拍子サポート（3/4, 6/8, 5/4等）
  
  # pyloudnorm設定
  pyloudnorm:
    block_size: 0.4    # EBU R128ブロックサイズ（秒）
  
  # librosa_enhanced設定（Phase A）
  librosa_enhanced:
    bandpass_low: 5000   # Hz（5-12kHz帯域限定）
    bandpass_high: 12000
    onset_threshold: 0.6  # ロバスト閾値
    aggregate_window: 0.1  # フレーム集計窓（秒）
  
  # Essentia設定（Phase D準備、probe_only）
  essentia:
    sample_rate: 44100
    frame_size: 4096
    hop_size: 512
    hpcp:
      size: 12           # 12次元Chroma
      harmonics: 4       # 第4倍音まで考慮
      band_preset: true  # 楽器音最適化
  
  # Chordino設定（Phase D準備、probe_only）
  chordino:
    prefer_essentia: true  # Essentia HPCP優先、librosaフォールバック
    min_confidence: 0.3    # コード確信度閾値

# 🆕 Harmony（和声）設定
harmony:
  tension_policy: auto       # auto | off
  hybrid_alpha: 0.60         # audio(chordmap_dp_final) vs text(chordmap) ブレンド比率
                             # 1.0=audio優先、0.0=text優先
                             # 原曲忠実度重視のため0.6-0.75推奨

# 🆕 Anchors（ボーカル同期）設定
anchors:
  duck_ms: 80          # アンカー近傍のミュート/減衰範囲（ms）
  grace_ms: 40         # グレースノート窓
  accent_boost: 10     # アンカー直後のアクセント増幅
  strict_default: true # デフォルトで厳格モード有効化（B-1）

# 🆕 ハイブリッド和声設定（B-3）
harmony:
  hybrid_alpha: 0.60   # audio/text和声のブレンド比率（audio寄り: 0.6推奨）
  tension_whitelist: [9, 11, 13, "#11"]  # 許可するテンション


