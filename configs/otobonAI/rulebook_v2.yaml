        - お洒落
        - 都会的
        - チル
        - 順次下降
    usage_guidelines:
      recommended_frequency: セクション内でループさせると効果的。
      good_places: Aメロ、Bメロ、間奏など。
      pitfalls: 強い解決感がないため、サビで使う場合はメロディやリズムで盛り上がりを作る工夫が必要。
    example_progressions:
      - Fmaj7 - Em7 - Dm7 - G7 (in Key=C)
  - id: HRM_021
    name: ヒゲダン進行 (多様なドミナント活用)
    category: harmony
