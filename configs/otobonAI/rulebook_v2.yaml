      description: アーティスト Vaundy が多用することで知られる、ダイアトニックコードを順次下降していく進行。ベースラインが滑らかに動き、お洒落で少し物憂げな雰囲気を生み出す。セブンスコードやテンションコードで演奏するのが基本。
      bar_span: 4
      melodic_motion: stepwise
      special_devices:
        - diatonic_seventh_chords
        - stepwise_bassline
    effect:
      emotions:
        - stylish
        - mellow
        - sentimental
        - urban
      keywords:
