      pitfalls: 特になし。トライアドの代わりとして積極的に使える。
    example_progressions:
      - Cadd9
      - Gadd9
  - id: HRM_019
    name: Vaundy進行 (4325進行)
    category: harmony
    scope:
      - chorus
      - verse
      - any
    layer: chord
    preconditions:
      tonality: major
      typical_progression: IV△7-IIIm7-IIm7-V7
      tempo_bpm_range: [80, 130]
      typical_genres:
        - J-POP
        - city_pop
        - R&B
