rules:
  - id: HRM_001
    name: 王道進行 (4536進行)
    category: harmony
    scope:
      - chorus
      - pre_chorus
      - any
    layer: chord
    preconditions:
      tonality: major
      typical_progression: IV-V-IIIm-VIm
      tempo_bpm_range: [80, 180]
      typical_genres:
        - J-POP
        - anime
        - rock
        - ballad
    pattern:
      description: J-POPで最も多用される進行。サブドミナント(IV)からドミナント(V)へ進む高揚感と、その後にマイナーコード(IIIm, VIm)へ続く切なさを両立できる。
      bar_span: 4
      special_devices: []
    effect:
      emotions:
        - hopeful
        - bittersweet
        - emotional
        - uplifting
      keywords:
        - 王道
        - 高揚感
        - 切ない
        - J-POP感
    usage_guidelines:
      recommended_frequency: 曲中で繰り返し使用可能
      good_places: サビで最も効果を発揮する。
      pitfalls: 非常に多用されるため、アレンジで独自性を出す必要がある。
    example_progressions:
      - F - G - Em - Am (in Key=C)
  - id: HRM_002
    name: 丸の内サディスティック進行 (Just The Two of Us進行)
    category: harmony
    scope:
      - chorus
      - verse
      - any
    layer: chord
    preconditions:
      tonality: any
      typical_progression: IV△7-III7-VIm7-Vm7-I7
      tempo_bpm_range: [90, 140]
      typical_genres:
        - J-POP
        - city_pop
        - anime
        - R&B
    pattern:
      description: 都会的で洗練された浮遊感が特徴のコード進行。IV△7のお洒落な響きから始まり、VIm7へのセカンダリードミナントであるIII7を挟み、最後は次のコードへのマイナーII-V(Vm7-I7)で締めくくる。ループ性が高い。
      bar_span: 4
      special_devices:
        - secondary_dominant
        - two_five_one
        - tension_chord
      variants:
        - name: III7(#9)の使用
          description: III7に#9thのテンションを加えることで、よりブルージーで緊張感のある響きを作り出し、次のVIm7への解決感を強調する。
          effect:
            emotions:
              - tense
              - jazzy
              - stylish
            keywords:
              - ジミヘンコード
              - ブルージー
    effect:
      emotions:
        - stylish
        - sentimental
        - floating
        - mellow
      keywords:
        - 都会的
        - お洒落
        - 浮遊感
        - 椎名林檎
        - シティポップ
    usage_guidelines:
      recommended_frequency: セクション内でループさせると世界観を構築しやすい。
      good_places: イントロ、Aメロ、サビなど曲の主要部分。
      pitfalls: 進行自体が非常に個性的であるため、楽曲の世界観と合わない場合は浮いてしまう可能性がある。
    example_progressions:
      - Fmaj7 - E7 - Am7 - Gm7-C7 (Key=F/Am)
      - Fmaj7 - E7(#9) - Am7 - Gm7-C7 (Key=F/Am)
  - id: HRM_003
    name: 小室進行 (6451進行)
    category: harmony
    scope:
      - chorus
      - any
    layer: chord
    preconditions:
      tonality: minor_key_start
      typical_progression: VIm-IV-V-I
      tempo_bpm_range: [110, 160]
      typical_genres:
        - J-POP
        - dance
        - anime
    pattern:
      description: マイナーコード(VIm)の切ない響きから始まり、J-POPの定番であるIV-V-Iのカデンツで力強く解決する進行。哀愁と疾走感を両立させやすい。
      bar_span: 4
      special_devices: []
    effect:
      emotions:
        - bittersweet
        - uplifting
        - dramatic
        - nostalgic
      keywords:
        - 90年代
        - 切ないけど前向き
        - 疾走感
        - 小室哲哉
    usage_guidelines:
      recommended_frequency: サビで繰り返し使用されることが多い。
      good_places: サビ、イントロ。
      pitfalls: 王道進行と同様、アレンジで差別化が必要。
    example_progressions:
      - Am - F - G - C (in Key=C/Am)
  - id: HRM_004
    name: 泣きのコード進行 (Ⅱ-Ⅴ to Minor)
    category: harmony
    scope:
      - pre_chorus
      - bridge
      - chorus
    layer: global
    preconditions:
      tonality: any
      typical_progression: IIm7-5 -> V7 -> Im
      tempo_bpm_range: [60, 140]
      typical_genres:
        - ballad
        - anime
        - J-POP
        - rock
    pattern:
      description: マイナーキーのトニック(Im)に向かう非常に強い解決感と切なさを持つ進行。セカンダリードミナント(V7/vi)をさらにⅡ-Ⅴ化した形(iim7-5/vi -> V7/vi -> vi)。4度進行（強進行）の連続であり、流れが非常にスムーズかつドラマチック。
      bar_span: 2
      special_devices:
        - secondary_dominant
        - two_five_one
        - minor_two_five_one
    effect:
      emotions:
        - sad
        - dramatic
        - emotional
        - crying
        - sentimental
      keywords:
        - 泣き
        - エモい
        - 切ない
        - 感動的
        - クライマックス
    usage_guidelines:
      recommended_frequency: 曲中のクライマックスで1〜2回
      good_places: サビのキメ、Bメロからサビへの繋ぎ、ブリッジ、落ちサビ。
      pitfalls: 多用すると安っぽくなる可能性がある。感情が最も高まる場所で使うのが効果的。
    example_progressions:
      - Bm7-5 -> E7 -> Am (Targeting Am in Key=C)
  - id: HRM_005
    name: 偽終止 (期待の裏切り)
    category: harmony
    scope:
      - any
    layer: chord
    preconditions:
      tonality: major
      typical_progression: V -> VIm (or IV)
      tempo_bpm_range: [60, 200]
      typical_genres:
        - J-POP
        - anime
        - rock
    pattern:
      description: ドミナントコード(V)がトニック(I)に解決するだろうという聴き手の期待を裏切り、代理トニックであるVImに着地させる手法。曲が『終わった』と思わせず、まだ続きがあることを予感させる効果がある。
      bar_span: 2
      special_devices:
        - deceptive_cadence
    effect:
      emotions:
        - surprised
        - unresolved
        - continuing
      keywords:
        - 裏切り
        - 意外性
        - 余韻
    usage_guidelines:
      recommended_frequency: セクションの終わりや、展開を変化させたい時に使用。
      good_places: サビの終わり、Aメロの終わり。
      pitfalls: 曲の本当の終わりで使うと終止感が弱くなる。
    example_progressions:
      - Dm - G - Am (instead of C) (in Key=C)
      - Dm - G - F (another variant) (in Key=C)
  - id: HRM_006
    name: パッシング・ディミニッシュ (滑らかな経過)
    category: harmony
    scope:
      - any
    layer: chord
    preconditions:
      tonality: any
      typical_progression: I -> #I dim -> IIm
      tempo_bpm_range: [60, 200]
      typical_genres:
        - J-POP
        - jazz
        - anime
    pattern:
      description: 全音差で動く2つのコードの間に、半音階で繋ぐディミニッシュコードを挿入する手法。ベースラインが滑らかな半音進行（クロマチック）になり、ドラマチックで物語性のある展開を生み出す。
      bar_span: 1.5
      beats_targeted: [3]
      melodic_motion: chromatic
      special_devices:
        - passing_diminished
    effect:
      emotions:
        - dramatic
        - tense
        - smooth_transition
      keywords:
        - 経過音
        - ドラマチック
        - 半音進行
    usage_guidelines:
      recommended_frequency: 必要に応じて複数回使用可能。
      good_places: AメロやBメロで、コード進行に動きを加えたいとき。
      pitfalls: 響きが独特なため、メロディや他の楽器との調和に注意が必要。
    example_progressions:
      - C -> C#dim -> Dm7
      - G -> G#dim -> Am
  - id: HRM_007
    name: サブドミナントマイナー (感動・切なさの演出)
    category: harmony
    scope:
      - pre_chorus
      - chorus
      - bridge
    layer: chord
    preconditions:
      tonality: major
      typical_progression: IV -> ivm -> I
      tempo_bpm_range: [60, 160]
      typical_genres:
        - J-POP
        - ballad
        - anime
    pattern:
      description: 同主調のマイナーキーからサブドミナントコード(ivm)を一時的に借用するモーダルインターチェンジの一種。メジャーキーの明るい流れの中で一瞬だけ影を落とし、強い切なさや感動的な雰囲気を生み出すJ-POPの定番テクニック。トップノートが半音下降(6→b6)する動きが特徴的。
      bar_span: 2
      special_devices:
        - modal_interchange
        - borrowed_chord
        - subdominant_minor
    effect:
      emotions:
        - sad
        - dramatic
        - nostalgic
        - bittersweet
      keywords:
        - エモい
        - 切ない
        - 感動
        - 暗転
        - 涙腺崩壊
    usage_guidelines:
      recommended_frequency: 1曲に1〜2回、最も感情を高めたい箇所で使用
      good_places: サビの後半、ブリッジ、アウトロなど、曲のクライマックス部分。
      pitfalls: 多用すると曲全体の調性が曖昧になり、効果が薄れる。
    example_progressions:
      - F -> Fm -> C (in Key=C)
  - id: HRM_008
    name: 裏コード (トライトーン・サブスティテューション)
    category: harmony
    scope:
      - any
    layer: global
    preconditions:
      tonality: any
      typical_progression: subV7 -> I
      tempo_bpm_range: [80, 150]
      typical_genres:
        - jazz
        - city_pop
        - R&B
        - anime
    pattern:
      description: ドミナントセブンスコード(V7)を、その増4度(トライトーン)上にあるドミナントセブンスコード(bII7)で代理する手法。ジャズ由来のテクニックで、非常に洗練されたお洒落な響きを生む。ベースラインが滑らかな半音下降進行(bII→I)になるのが最大の特徴。
      bar_span: 1
      melodic_motion: chromatic
      interval_semitones: [6]
      special_devices:
        - tritone_substitution
    effect:
      emotions:
        - stylish
        - sophisticated
        - jazzy
        - smooth
      keywords:
        - お洒落
        - ジャズ
        - 都会的
        - 半音下降
    usage_guidelines:
      recommended_frequency: 曲のアクセントとして数回使用
      good_places: II-V-I進行のV7を置き換える、ターンアラウンドなど。
      pitfalls: ジャンルによっては浮いてしまう可能性があるため、曲全体の雰囲気に合わせる必要がある。
    example_progressions:
      - Dm7 -> Db7 -> Cmaj7 (instead of Dm7 -> G7 -> Cmaj7)
      - A7 -> Dm7 -> G7 -> Cmaj7 を A7 -> Dm7 -> Db7 -> Cmaj7 に変更
  - id: HRM_009
    name: カノン進行
    category: harmony
    scope:
      - any
    layer: chord
    preconditions:
      tonality: major
      typical_progression: I–V–VIm–IIIm–IV–I–IV–V
      tempo_bpm_range: [70, 140]
      typical_genres:
        - J-POP
        - ballad
        - pop
    pattern:
      description: クラシック曲「パッヘルベルのカノン」を元にした進行で、非常に美しく感動的な響きを持つ。ベースラインが滑らかに順次下降していくのが特徴。J-POPでも数多くのヒット曲で使用されている。
      bar_span: 8
      special_devices:
        - stepwise_bassline
    effect:
      emotions:
        - beautiful
        - dramatic
        - nostalgic
        - grand
      keywords:
        - カノン
        - 感動的
        - 壮大
        - 卒業ソング
    usage_guidelines:
      recommended_frequency: サビや大サビで使うと非常に効果的。
      good_places: サビ、ブリッジ、アウトロ。
      pitfalls: 非常に有名で強力な進行であるため、メロディが負けてしまうことがある。
    example_progressions:
      - C - G - Am - Em - F - C - F - G (in Key=C)
  - id: HRM_010
    name: ドミナントモーション（V7→I/Imで明確な着地を作る）
    category: harmony
    scope:
      - chorus
      - pre-chorus
      - cadence
      - any
    layer: chord
    preconditions:
      tonality: any
      typical_progression: V7-I / V7-Im
      tempo_bpm_range: [60, 190]
      typical_genres:
        - J-POP
        - rock
        - ballad
        - anime
    pattern:
      description: |
        キー内のVコードをセブンス化し（V7）、トニックIまたはImへ解決させることで、不安定さが一気に解消される強い終止感を作る。セクション末尾やフレーズの締めに使うと、ストーリーの区切りが非常に明確になる。([うちやま作曲教室][1])
      bar_span: 1
      beats_targeted: [1]
      melodic_motion: null
      special_devices:
        - dominant_motion
        - functional_harmony
    effect:
      emotions:
        - resolved
        - satisfied
        - safe
        - dramatic
      keywords:
        - 終止感
        - カタルシス
        - 安定への着地
        - ストーリー性
    usage_guidelines:
      recommended_frequency: 各ブロックの終止や曲中の要所に数回。多用しすぎると予定調和になりがち。
      good_places: サビ終わり、Aメロ/Bメロの終止、小節の区切り、ラストの大団円。
      pitfalls: どの終止もV7→Iにすると単調になる。サビ以外ではV→IやIV→Iなど、終止感の強さにグラデーションをつける。
    example_progressions:
      - G7 → C (Key=C)
      - E7 → Am (Key=C)
      - A7 → D (Key=D)
  - id: HRM_011
    name: 強進行（4度上行／5度下行するルートで説得力を作る）
    category: harmony
    scope:
      - any
    layer: chord
    preconditions:
      tonality: any
      typical_progression: 任意のコードから完全4度上（または5度下）へ進む
      tempo_bpm_range: [60, 200]
      typical_genres:
        - J-POP
        - rock
        - R&B
        - anime
        - idol
    pattern:
      description: |
        コード・ルートを完全4度上（または完全5度下）へ動かすつなぎ方。I→IV，IIIm→VIm，IIm→V，V→I など。ルートの『重力』が自然に働くため、聴きやすく一貫性のあるコード進行の骨格になる。([うちやま作曲教室][2])
      bar_span: 1
      beats_targeted: [1]
      melodic_motion: null
      special_devices:
        - strong_root_motion
    effect:
      emotions:
        - natural
        - cohesive
        - confident
      keywords:
        - 聴きやすさ
        - 一貫性
        - 説得力
        - 安定した推進力
    usage_guidelines:
      recommended_frequency: 進行の骨組みとして多用可。全体の6〜8割を強進行で組み、残りを他の動きで彩るイメージ。
      good_places: Aメロ〜サビ全体の土台、II-V-Iなどの定番連結、転調前後の繋ぎ。
      pitfalls: すべてを強進行だけで組むと予定調和になる。ときどき平行移動や半音進行、ルート保持などで変化をつける。
    example_progressions:
      - C → F → B♭ (I → IV → VII♭)
      - Em → Am → Dm (IIIm → VIm → IIm)
      - Dm → G → C (IIm → V → I)
  - id: HRM_012
    name: セカンダリードミナント（ターゲットコードを照らすノンダイアトニック）
    category: harmony
    scope:
      - pre-chorus
      - chorus
      - bridge
      - any
    layer: chord
    preconditions:
      tonality: any
      typical_progression: X7 → target_chord（X7 = target_chord の V7）
      tempo_bpm_range: [70, 190]
      typical_genres:
        - J-POP
        - rock
        - R&B
        - jazz-influenced pop
    pattern:
      description: |
        ダイアトニック外の『V7 of 〜』を、目的のコード直前に挿入する手法。I以外のコードを一瞬そのキーのIとして扱い、X7→target_chord でミニ終止を作ることで、ターゲットを強調する。ポップスではII、IV、VIm などへのセカンダリードミナントがよく使われる。([うちやま作曲教室][3])
      bar_span: 1
      beats_targeted: [1]
      melodic_motion: null
      special_devices:
        - secondary_dominant
        - nondiatonic_color
    effect:
      emotions:
        - bright
        - forward
        - tense
        - colorful
      keywords:
        - 一瞬の転調感
        - ターゲット強調
        - 都会的
        - コードの色彩感
    usage_guidelines:
      recommended_frequency: 1曲に数カ所。サビ前やハイライトの直前など『見せ場』で使うと効果的。
      good_places: サビ頭のコード直前（例：A7→Dm→G→C）、ブリッジでの流れの切り替え、転調の補助。
      pitfalls: 挿入しすぎると常に落ち着かない印象になる。IIIやVIIm-5へのセカンダリードミナントはポップスでは使用頻度が低いので乱用しない。
    example_progressions:
      - C → A7 → Dm → G (I → VI7 → IIm → V)
      - F → C7 → F (IV → I7/IV → IV in Key=C)
      - G → E7 → Am (V → III7 → VIm)
  - id: HRM_013
    name: クリシェ（コード構成音を半音階で動かして内声ラインを作る）
    category: harmony
    scope:
      - verse
      - pre-chorus
      - chorus
      - bridge
    layer: chord
    preconditions:
      tonality: any
      typical_progression: I→Imaj7→I7→I6 など
      tempo_bpm_range: [60, 180]
      typical_genres:
        - J-POP
        - rock
        - city pop
        - ballad
        - R&B
    pattern:
      description: |
        同じコード機能を保ったまま構成音の1つだけを半音〜全音で順次変化させ、縦のコード列に横方向のライン（クリシェ）を作る。Iの根音やIIm/VImの根音を下げていく、Iの5度を上げていくパターンが典型。([うちやま作曲教室][4])
      bar_span: 4
      beats_targeted:
        - 1
        - 1
        - 1
        - 1
      melodic_motion: stepwise_inner_voice
      special_devices:
        - cliche_line
        - chromatic_inner_voice
    effect:
      emotions:
        - nostalgic
        - sophisticated
        - romantic
      keywords:
        - 内声ライン
        - 半音階の色気
        - 都会的
        - 大人っぽい
    usage_guidelines:
      recommended_frequency: 1ブロックに1〜2回程度。サビ全体をクリシェで埋めるより、要所の装飾として使うと映える。
      good_places: AメロやBメロの中盤、サビ後半での盛り上げどころ、同一コードが続く部分の退屈さ解消。
      pitfalls: メロディラインとクリシェラインがぶつかりやすい。歌メロの主役感を損なわないよう、内声として控えめな音域に置く。
    example_progressions:
      - C → CM7 → C7 → C6（I→Imaj7→I7→I6）
      - Dm → DmM7 → Dm7 → Dm6（IIm系クリシェ）
      - C → Caug → C6 → C7（5度クリシェ）
  - id: HRM_014
    name: ディミニッシュコードの活用（パッシング＆ドミナント代理）
    category: harmony
    scope:
      - pre-chorus
      - bridge
      - turnaround
    layer: chord
    preconditions:
      tonality: any
      typical_progression: C→C♯dim→Dm / C→A#dim→Dm など
      tempo_bpm_range: [70, 180]
      typical_genres:
        - J-POP
        - rock
        - jazz-influenced pop
        - idol
        - enka-pop
    pattern:
      description: |
        短3度ずつ積み重ねた4音からなるディミニッシュコードを、二つのコードの間の『通り道』として挟んだり、ドミナントセブンスやセカンダリードミナントの代理として用いる。ルートを半音上にしたdimでV7（またはVI7など）を置き換えると、鋭いテンションを保ったまま進行を滑らかにできる。([うちやま作曲教室][5])
      bar_span: 1
      beats_targeted: [1]
      melodic_motion: null
      special_devices:
        - passing_diminished
        - dominant_substitution
    effect:
      emotions:
        - tense
        - mysterious
        - dramatic
      keywords:
        - スパイス
        - 不安定な色気
        - ジャジー
        - 緊張と解放
    usage_guidelines:
      recommended_frequency: 1曲に1〜3カ所程度のアクセントとして。
      good_places: コードが半音ずつ上がる／下がる瞬間、サビ前の最後の一押し、ブリッジでの緊張感のピーク。
      pitfalls: 連発すると常に落ち着かない曲になる。メロディのスケール外音との衝突に注意し、長く引き伸ばさず短い滞在で抜ける。
    example_progressions:
      - C → C♯dim → Dm
      - C → A7 → Dm → C → A#dim → Dm
      - F → F#dim → Gm
  - id: HRM_015
    name: サブドミナントマイナーとその代理コード（借用和音でほろ苦さを加える）
    category: harmony
    scope:
      - pre-chorus
      - chorus
      - bridge
    layer: chord
    preconditions:
      tonality: major
      typical_progression: I→IVm→V→I / I→IIm7-5→V→I など
      tempo_bpm_range: [60, 170]
      typical_genres:
        - J-POP
        - ballad
        - city pop
        - anime
    pattern:
      description: |
        メジャーキーにおいて、サブドミナント機能を持つコードをマイナー化したもの（IVm や IIm7-5、♭IIM7，♭VI7 など）を用いて、一瞬だけ別の調から借りてきたような色合いを加える。I→IVm→V→I や I→IIm7-5→V→I が典型。([うちやま作曲教室][6])
      bar_span: 2
      beats_targeted:
        - 1
        - 1
      melodic_motion: null
      special_devices:
        - subdominant_minor
        - borrowed_chord
    effect:
      emotions:
        - bittersweet
        - melancholic
        - deep
        - dramatic
      keywords:
        - 借用和音
        - ほろ苦さ
        - 大人っぽいサウンド
        - 感傷的
    usage_guidelines:
      recommended_frequency: サビやブリッジで1〜2回程度。クライマックスの一番おいしい場所に置くイメージ。
      good_places: サビの中盤〜終盤、Aメロ→サビへの橋渡し、最後のサビでの『もう一段だけ切なくする』ポイント。
      pitfalls: 多用するとどの場面も同じ色合いになる。歌メロがナチュラルスケールだけで書かれている場合、メロディが浮いて聴こえることがあるので要チェック。
    example_progressions:
      - C → Fm → G → C (I→IVm→V→I)
      - C → Dm7-5 → G → C (I→IIm7-5→V→I)
      - C → Fm → D♭M7 → G7 → C
  - id: HRM_016
    name: J-POP王道進行 (451カデンツ)
    category: harmony
    scope:
      - chorus
      - any
    layer: chord
    preconditions:
      tonality: major
      typical_progression: IV-V-I
      tempo_bpm_range: [80, 200]
      typical_genres:
        - J-POP
        - rock
        - anime
    pattern:
      description: サブドミナント(IV)→ドミナント(V)→トニック(I)という、非常に強い解決感とポジティブな印象を与える基本的なカデンツ。多くの楽曲のサビの締めや盛り上がる部分で使用される。
      bar_span: 2
      special_devices:
