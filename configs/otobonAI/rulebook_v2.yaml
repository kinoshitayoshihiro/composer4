      good_places: コードチェンジをまたぐタイミング。
      pitfalls: 多用すると調性が曖昧になる。
    example_progressions:
      - Cmaj7に向かう直前に、メロディでDbの音を短く鳴らしてからCの音に着地する。
  - id: MLD_001
    name: オクターブ跳躍メロディ (Octave Leap Melody)
    category: melody
    scope:
      - chorus
      - climax
    layer: melody
    preconditions:
      tonality: any
      typical_progression: null
      tempo_bpm_range: [60, 180]
      typical_genres:
        - J-POP
        - anime
        - idol pop
    pattern:
      description: A melodic leap spanning a full octave (or other large leap, e.g. a major 6th/7th).
        Often the melody jumps to a much higher note at a dramatic moment (such as the start
        of a chorus or on a key lyric) before coming back down or resolving.
      bar_span: null
      beats_targeted: null
      melodic_motion: leap
      special_devices: []
    effect:
      emotions:
        - excited
        - surprised
      keywords:
        - 大跳躍
        - インパクト
        - 高揚
    usage_guidelines:
      recommended_frequency: Rarely – typically one or a few standout moments in a song (e.g.
        the chorus entry or a bridge climax).
      good_places: The beginning of a chorus or on a crucial word to create a peak moment.
        A sudden octave jump can also be used to lead into a key change or final chorus for
        maximum impact.
      pitfalls: Octave leaps are vocally challenging; ensure the singer can hit the jump comfortably.
        Overuse of big leaps can make a melody feel disjointed or too difficult to sing
        along with. Balance leaps with stepwise motion afterwards to give a sense of resolution
        (listeners often expect a leap to be "answered" by stepwise movement).
    example_progressions:
      - (Melodic example) Verse ends on G4, then chorus starts on G5 (one octave higher)
        on the first syllable for dramatic entry.
  - id: MLD_002
    name: 半音階的アプローチ (Chromatic Approach in Melody)
    category: melody
    scope:
      - any
    layer: melody
    preconditions:
      tonality: any
      typical_progression: null
      tempo_bpm_range: [60, 140]
      typical_genres:
        - J-POP
        - jazz
        - fusion
    pattern:
      description: Introducing notes outside the diatonic scale by approaching a target note from
        a half-step above or below. For instance, in C major, a melody might use an F# as
        a passing tone between F and G or approach a chord tone by a semitone. This technique
        adds color by briefly touching on chromatic notes.
      bar_span: null
      beats_targeted: null
      melodic_motion: chromatic
      special_devices:
        - approach_tone
        - passing_tone
    effect:
      emotions:
        - sophisticated
        - tense
      keywords:
        - ジャズ風
        - 艶やか
        - 非ダイアトニック
    usage_guidelines:
      recommended_frequency: Use sparingly within a melody – a few chromatic approach notes
        can go a long way in a pop context.
      good_places: Ballads or jazz-influenced pop sections where a subtle "blues" or classical
        feel is desired. Often on introspective lines or before important chord tones (e.g.
        approaching a major 3rd or 5th of the chord chromatically).
      pitfalls: Out-of-scale notes can sound wrong if not resolved properly. Make sure the chromatic
        note quickly leads to a chord tone or a stable scale tone so it sounds intentional.
        Overusing chromatic notes in a straightforward genre can make the melody feel stylistically
        inconsistent or too "old-fashioned". Aim for a tasteful touch of chromaticism to
        enhance sophistication.
    example_progressions:
      - (Melodic line example) E – F – F# – G (chromatic walk-up in C major scale on
        a melody line)
  - id: MLD_003
    name: 四七抜き音階 (Yonánuki/Pentatonic Scale)
    category: melody
    scope:
      - verse
      - chorus
    layer: melody
    preconditions:
      tonality: major
      typical_progression: Uses scale tones 1-2-3-5-6 (no 4th or 7th in major scale)
      tempo_bpm_range: [70, 180]
      typical_genres:
        - J-POP
        - traditional
        - folk
        - rock
    pattern:
      description: Uses the pentatonic scale that omits the 4th and 7th scale degrees (in major)
        or analogous pentatonic structures. For example, in C major, the melody would use
        C, D, E, G, A (no F or B). This scale has no semitone intervals, giving it a distinctive
        open sound.
      bar_span: null
      beats_targeted: null
      melodic_motion: pentatonic
      special_devices: []
    effect:
      emotions:
        - nostalgic
        - friendly
      keywords:
        - 和風
        - 郷愁
        - キャッチー
    usage_guidelines:
      recommended_frequency: Can be used as the primary scale for an entire melody or just
        in certain sections. Very common in multiple songs (not considered overused if it
        fits the style).
      good_places: To evoke a Japanese or folk feeling (often a "Wa" traditional mood) or simply
        to achieve a catchy, easy-to-sing melody. Many chorus hooks naturally end up pentatonic
        because they feel familiar and memorable. A song may use yonanuki for an entire
        chorus to give a bright, nostalgic hook.
      pitfalls: Sticking strictly to pentatonic can limit harmonic interest (since avoid notes
        like the 4th and 7th which create tension). If a song is entirely yonanuki, be mindful
        that it might lack strong leading tones or tension – this can be good for simplicity,
        but make sure the arrangement provides dynamics elsewhere. Conversely, suddenly
        switching to pentatonic melody mid-song will strongly change the vibe – use that
        consciously if done.
    example_progressions:
      - (Melody notes example in C) C - D - E - G - A (major pentatonic scale tones, no
        F/B). Many folk songs and anime tunes use such pentatonic melodies for a warm,
        familiar feel.
  - id: MLD_004
    name: 上昇シークエンス (Rising Sequence)
    category: melody
    scope:
      - build-up
      - chorus
    layer: melody
    preconditions:
      tonality: any
      typical_progression: null
      tempo_bpm_range: [60, 170]
      typical_genres:
        - J-POP
        - anime
        - musical
    pattern:
      description: A melodic or harmonic figure that is repeated multiple times, each time at a
        higher pitch (usually by a consistent interval such as a step or a diatonic third).
        This creates a "staircase" effect in the melody or chords, intensifying each repetition.
      bar_span: null
      beats_targeted: null
      melodic_motion: sequential
      special_devices: []
    effect:
      emotions:
        - anticipation
        - exhilaration
      keywords:
        - 盛り上げ
        - 反復
        - クレシェンド
    usage_guidelines:
      recommended_frequency: Use for special moments – typically one major rising sequence
        per song (for instance, leading into the final chorus or during a guitar solo or
        instrumental break).
      good_places: Pre-chorus or end of chorus e.g., a motif that repeats three times, each
        time starting higher, to build excitement into the chorus or climax. It can also
        be used mid-chorus to continually lift the energy (common in anime songs where the
        chorus melody ascends in steps).
      pitfalls: Ensure the sequence logically fits the chord progression – sequences often imply
        key changes or temporary tonal shifts, so the chords beneath should support each
        repetition. If the rise is too steep or goes on too long, it can sound forced or
        become straining for the singer. End the sequence satisfyingly (often the final
        high point resolves into a chorus payoff or a sustained note).
    example_progressions:
      - Melodic example: (in Key=C) First phrase: G-A-E-F, Second phrase a step higher:
        A-B-F#-G, Third phrase higher: B-C-G-A, culminating into the chorus high C note.
  - id: RHY_004
    name: ギターカッティング
    category: rhythm
    scope:
      - any
