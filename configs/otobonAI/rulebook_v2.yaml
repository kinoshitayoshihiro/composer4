      good_places: 長い音符が続く部分や、同じ音が続く部分に動きを加えたいとき。
      pitfalls: 多用しすぎるとメロディの骨格が分かりにくくなることがある。
    example_progressions:
      - Cコード上でメロディが「ド→レ→ド」と動く。
  - id: MEL_008
    name: 共通音を活かしたメロディ
