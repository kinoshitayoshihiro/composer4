        - idol
        - anime
        - children
    pattern:
      description: |
        短い音価（8分音符・16分音符）を多用すると、アクセントが増えてせわしない・にぎやかなメロディになる。長い音価（付点4分音符・2分音符など）を多用すると、どっしりとした・ゆったりしたメロディになる。ブロックごとに使う音符の長さを変えることで、場面転換をはっきり感じさせられる。([うちやま作曲教室][9])
      bar_span: null
      beats_targeted: null
      melodic_motion: rhythmic_density_control
      special_devices:
        - note_value_contrast
    effect:
      emotions:
        - energetic
        - busy
        - calm
        - majestic
      keywords:
        - リズムのメリハリ
        - 場面転換
        - せわしなさ
        - どっしり感
    usage_guidelines:
      recommended_frequency: 各ブロックの作曲時に『平均音価』を決めて意識的に運用する。
      good_places: Aメロは細かめ、Bメロはやや中庸、サビは長い音を混ぜてスケール感を出す、などのコントラスト設計。
      pitfalls: すべてのブロックで同じような音価配分にすると、A/B/サビの違いが弱くなる。歌い手のブレスや発音難度にも配慮する。
    example_progressions:
      - Aメロ：8分音符主体の細かいフレーズ
      - Bメロ：4分音符主体＋ところどころ8分音符
      - サビ：付点4分＋2分音符で大きく歌う
  - id: MEL_002
    name: リディアンスケール (#4の浮遊感)
