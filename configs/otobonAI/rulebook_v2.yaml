      recommended_frequency: 曲の締めくくりとして多用される。
      good_places: サビの最後、曲の最後。
      pitfalls: シンプルすぎるため、これだけでは単調になりやすい。
    example_progressions:
      - F - G - C (in Key=C)
  - id: HRM_017
    name: I–V–I の重力（安定Iと不安定Vでストーリーを作る）
    category: harmony
    scope:
      - any
    layer: global
    preconditions:
      tonality: any
      typical_progression: I→V→I を基盤に発展させる
      tempo_bpm_range: [60, 200]
      typical_genres:
        - J-POP
        - rock
        - ballad
        - idol
        - anime
    pattern:
      description: |
        ダイアトニックコード内で、Iは最も安定した『着地点／出発点』、Vは不安定で『Iを連想させる』コードとして機能する。I→V→I という最短のストーリーを骨格として、間に他のコード（II, IV, VImなど）を挟んで複雑化していく。([うちやま作曲教室][8])
      bar_span: 4
      beats_targeted:
        - 1
        - 1
        - 1
        - 1
      melodic_motion: null
      special_devices:
        - functional_harmony
        - tonal_center
    effect:
      emotions:
        - narrative
        - resolved
        - grounded
      keywords:
        - 調性の重力
        - 帰結感
        - 分かりやすいストーリー
        - 統一感
    usage_guidelines:
      recommended_frequency: ほぼすべての曲で暗黙的に利用。特に曲頭・サビ頭・曲終わりにI、途中にVを絡めて大きな起伏を作る。
      good_places: 曲の冒頭とラストのI、サビ入り前のV、ブリッジ終わりからラスサビに向かうV→I。
      pitfalls: 常にIとVだけに頼ると単純すぎる。II, IV, VImなどの機能も理解した上で、I–V–Iの感覚を『見えない骨格』として意識する。
    example_progressions:
      - C → G → C (I → V → I)
      - C → Am → F → G → C (I → VIm → IV → V → I)
      - G → D → G (I → V → I in Key=G)
  - id: HRM_018
    name: add9コード (透明感と切なさ)
