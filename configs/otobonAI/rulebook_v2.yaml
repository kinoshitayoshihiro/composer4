        - non_chord_tone
    effect:
      emotions:
        - emotional
        - yearning
        - sad
        - beautiful
      keywords:
        - 倚音
        - エモい
        - 切ない
        - 非和声音
    usage_guidelines:
      recommended_frequency: 感情を表現したいメロディのアクセントとして使用。
      good_places: Aメロやサビの歌いだし。
      pitfalls: 解決先の音をしっかり鳴らさないと、ただ音が外れたように聞こえてしまう。
    example_progressions:
      - Cコード上でメロディが「レ→ド」と動く（レが倚音）。
  - id: MEL_007
    name: 刺繍音 (ネイバーノート)
