  - id: STR_001
    name: ブレイク (無音のインパクト)
    category: structure
    scope:
      - pre_chorus
      - chorus
    layer: global
    preconditions:
      tonality: any
      tempo_bpm_range: [100, 200]
      typical_genres:
        - rock
        - anime
        - J-POP
    pattern:
      description: サビの直前などで、全ての楽器の演奏を1拍〜2拍程度、一斉に停止させる手法。無音状態を作り出すことで聴き手の注意を引きつけ、その後の展開への期待感を最大化する。
      bar_span: 0.5
      special_devices:
        - break
        - rest
    effect:
      emotions:
        - anticipation
        - impactful
        - dramatic
      keywords:
        - ブレイク
        - キメ
        - 無音
        - インパクト
        - サビ前
    usage_guidelines:
      recommended_frequency: 1曲に1〜2回、最も効果的な場所で。
      good_places: Bメロの最後、サビに入る直前の4拍目。
      pitfalls: 多用すると効果が薄れる。ブレイク後のフレーズが弱いと肩透かしになる。
    example_progressions:
      - Bメロの最後のコードを短く切り、1拍以上の無音を挟んでサビに突入する。
  - id: STR_003
    name: イントロリプライズ (サビメロ先出し)
    category: structure
    scope:
      - intro
    layer: global
    preconditions:
      tonality: any
      typical_genres:
        - J-POP
        - anime
    pattern:
      description: 楽曲の冒頭（イントロ）で、サビのメロディやコード進行の一部を先行して提示する構成手法。聴き手に最もキャッチーな部分を最初に印象付け、「サビが来るまで待たせる」効果がある。
      special_devices:
        - intro_reprise
    effect:
      emotions:
        - catchy
        - anticipation
        - memorable
      keywords:
        - イントロ
        - サビメロ
        - 掴み
        - 伏線
    usage_guidelines:
      recommended_frequency: 曲の冒頭に1回。
      good_places: 楽曲のイントロ。
      pitfalls: サビのインパクトが若干弱まる可能性もあるが、J-POPでは非常に効果的な手法とされる。
    example_progressions:
      - イントロでピアノやシンセがサビのメロディを演奏し、一度静かになってからAメロが始まる。
  - id: RHT_001
    name: バックビート (Backbeat Emphasis)
    category: rhythm
    scope:
      - any
    layer: drums
    preconditions:
      time_signature: 4/4
      tempo_bpm_range: [60, 180]
      typical_genres:
        - J-POP
        - rock
        - pop
    pattern:
      description: Accenting the 2nd and 4th beats of the measure (typically with the snare drum).
        The classic pop/rock beat has a kick on 1 and 3 and a snare on 2 and 4, establishing
        a steady groove.
      bar_span: 1
      beats_targeted: [2, 4]
      special_devices: []
    effect:
      emotions:
        - energetic
        - grounded
      keywords:
        - ノリ
        - ドライブ感
        - 定番ビート
    usage_guidelines:
      recommended_frequency: Standard for most pop/rock songs – it can run through verses
        and choruses consistently.
      good_places: Virtually throughout the song's main sections (verses, choruses) to
        maintain rhythm and listener engagement. The backbeat gives the music a sense of
        forward motion and is the backbone of most modern genres.
      pitfalls: A constant backbeat can feel monotonous if the arrangement doesn't have variation.
        Usually it's fine, but be mindful in softer sections – sometimes dropping the
        backbeat (e.g., using half-time or no snare) can create dynamics. Generally, though,
        backbeat is safe and expected; the main "pitfall" would be deviating from it too
        much in a genre where it's expected, which could confuse the listener's sense of
        groove.
    example_progressions:
      - (Rhythm pattern example) Kick on beat 1 & 3, Snare on 2 & 4 for each measure
        – classic backbeat groove.
  - id: RHT_002
    name: アップビート強調 (Off-beat/Upbeat Accent)
    category: rhythm
    scope:
      - any
    layer: rhythm
    preconditions:
      time_signature: 4/4
      tempo_bpm_range: [70, 150]
      typical_genres:
        - ska
        - reggae
        - funk
        - J-POP
    pattern:
      description: Accenting the "&" (off-beats) of each beat instead of the downbeats. For
        example, a guitar might skank on the upbeats, or claps on the off-beats. This creates
        a syncopated, buoyant feel in contrast to straight on-beat playing.
      bar_span: 1
      beats_targeted:
        - 1&
        - 2&
        - 3&
        - 4&
      special_devices: []
    effect:
      emotions:
        - bouncy
        - lighthearted
      keywords:
        - 裏拍
        - 軽快
        - 跳ねた感じ
    usage_guidelines:
      recommended_frequency: Can define the groove of an entire song (e.g., reggae uses
        constant upbeat skanks) or be used in specific measures to add interest.
      good_places: Styles like ska or reggae use this throughout. In J-Pop, an upbeat accent
        might appear in a pre-chorus or bridge to create a lifting sensation or in dance-oriented
        tracks for a groovy feel. Also used in funk and city-pop guitar comping to add
        bounce.
      pitfalls: If the listener is not expecting an off-beat pattern, it can feel "off" or
        jittery. Ensure the rhythm section (drums/bass) still provides enough grounding
        (often the kick still on 1 and 3) so the groove doesn't feel lost. Mixing backbeat
        and upbeat accents requires tightness – if band timing is loose, off-beat accents
        can sound messy. Also be aware that constant off-beat guitar/piano stabs can tire
        the ear if not balanced with other rhythms.
    example_progressions:
      - (Rhythm feel example) In a measure of 4/4, hi-hat emphasizes every "&" between
        beats, or guitar plays staccato chords on off-beats, creating a skanking rhythm.
  - id: RHT_003
    name: シンコペーション (Syncopation)
    category: rhythm
    scope:
      - any
    layer: global
    preconditions:
      time_signature: any
      tempo_bpm_range: [60, 180]
      typical_genres:
        - funk
        - J-POP
        - dance
        - rock
    pattern:
      description: Deliberately placing accents on weak beats or off-beats, or tying notes
        across beats, to disrupt the regular metric pattern. This can include syncopated
        drum kick/snare patterns, or melodic rhythms that hit off the main beats.
      bar_span: null
      beats_targeted:
        - off-beats
      special_devices: []
    effect:
      emotions:
        - driving
        - unexpected
      keywords:
        - グルーヴ
        - アクセント移動
        - スリリング
    usage_guidelines:
      recommended_frequency: Often used to make a groove compelling – can be frequent in
        a song, but balanced with some on-beat content.
      good_places: In choruses or energetic sections to increase excitement. A syncopated
        bassline or drum pattern can define funk and uptempo pop. For example, a syncopated
        kick on the "16th-note off-beat" just before a snare hit gives a propulsive feel
        (as in city pop or funk). Also useful in instrumentals or solos to ramp up intensity.
      pitfalls: Too much syncopation without a steady reference can confuse the listener's
        sense of rhythm (making it hard to "find the beat"). It can also make a song hard
        to dance to if overdone. Typically you want a mix: some stable elements (e.g. hi-hat
        or rhythm guitar keeping time) while other elements syncopate. Ensure that the
        band hits the syncopated accents tightly together – sloppy syncopation can sound
        like rhythm errors.
    example_progressions:
      - (Rhythm example) In a 4/4 bar: Kick on 1, **(Kick again on the last 16th of
        2)**, Snare on 3, **(Snare ghost on the & of 3)**, Kick on 4 – this syncopated pattern
        drives the groove forward unexpectedly.
  - id: RHT_004
    name: シャッフル/スウィング (Shuffle Rhythm)
    category: rhythm
    scope:
      - any
    layer: global
    preconditions:
      time_signature: 4/4 or 12/8
      tempo_bpm_range: [80, 140]
      typical_genres:
        - blues
        - rock
        - J-POP
        - city pop
    pattern:
      description: A triplet-based rhythmic feel where the beat is divided unequally (first half
        longer, second half shorter), creating a "long-short" swinging pulse. In notation,
        often 4/4 with swung 8ths (felt as 12/8). The classic shuffle has a bouncy, galloping
        feel (ONE-and-uh-TWO-and-uh...).
      bar_span: 1
      beats_targeted: null
      special_devices: []
    effect:
      emotions:
        - soulful
        - laid-back
      keywords:
        - 跳ねる
        - ブルージー
        - ゆったり
    usage_guidelines:
      recommended_frequency: If chosen, it typically persists throughout the section or entire
        song as the fundamental groove.
      good_places: Songs that want a bluesy or nostalgic vibe. A J-Pop ballad might use a
        slight swing to feel more human and emotional. City pop and older kayoukyoku sometimes
        use a shuffle beat for a light, swaying groove. Use it for variety if most songs
        are straight 8ths – a shuffle will stand out.
      pitfalls: Mixing shuffle feel with straight feel is tricky unless you deliberately
        shift feel between sections. All instruments must agree on the swing rate – a drummer
        swinging while a synth line is straight can clash. Also, shuffle feels can sound
        "old" or retro; if that's not intended, use only a touch of swing (e.g., slightly
        late off-beats) rather than a full shuffle. Finally, a very fast shuffle can feel
        jittery (e.g., swinging 16ths at high BPM), so consider the tempo.
    example_progressions:
      - (Rhythm description) A drum pattern in shuffle: hi-hat plays swung 8ths (long-short-long-short),
        snare on 2 & 4, giving a lilting groove reminiscent of blues or some anime ending
        theme styles.
meta_rules:
  - id: META_001
    name: 進行の方向性と感情
    description: 上昇するベースラインは希望・高揚感、下降するベースラインは切なさ・落ち着きと結びつきやすい。クリシェやカノン進行、Vaundy進行のベースラインはこの効果を応用している。
    related_rule_ids:
      - HRM_009
      - HRM_019
  - id: META_002
    name: 緊張と緩和のサイクル (ドミナント・モーション)
    description: 音楽は「不安定(緊張)」から「安定(緩和)」への流れで構成される。ドミナントコード(V7, III7など)で緊張感を作り、トニックコード(I, VIm)で解決させるのが基本。このサイクルが楽曲の推進力を生む。
    related_rule_ids:
      - HRM_001
      - HRM_002
      - HRM_003
      - HRM_016
  - id: META_003
    name: 期待の構築と裏切り
    description: 王道進行などの定番パターンは聴き手に「次はこの音が来る」という期待を抱かせる。その期待を偽終止(V→VIm)や借用和音で意図的に裏切ることで、強いインパクトや意外性を生み出し、聴き手を飽きさせないフックになる。
    related_rule_ids:
      - HRM_025
  - id: META_004
    name: 代理コードによる色彩の変化
    description: 同じ機能を持つコード同士や、構成音が非常に似ているコード（例：III7と♭IIIdim7）は入れ替えが可能（代理）。代理コードを使うことで、コード進行の色彩を豊かにし、より洗練された響きを作ることができる。
    related_rule_ids:
      - HRM_047
  - id: META_005
    name: 非和声音（繋ぎの音）の美学
    description: コードとコードの間を繋ぐ経過音（パッシングノート）や、メロディに細かな動きを与える刺繍音（ネイバーノート）、強拍で不協和音を鳴らして解決する倚音（アポジャトゥーラ）は、音楽に滑らかさと強い情緒的表現を与える。
    related_rule_ids:
      - MEL_007
  - id: META_006
    name: インパクトは「跳躍」と「逸脱」から生まれる
    description: 聴き手の耳を引くキャッチーな要素は、音程の大きな跳躍（オクターブ跳躍など）や、現在のキーからの逸脱（セカンダリードミナント、モーダルインターチェンジなど）によって生まれることが多い。これらを曲の重要なポイントに配置するのが効果的。
  - id: META_007
    name: 借用和音による感情の深化 (Borrowed Chords)
    description: 同主調など、他のキーから一時的にコードを「借りてくる」モーダルインターチェンジは、曲の感情を瞬時に深化させる強力な手法である。サブドミナントマイナー(ivm)や♭VI-♭VII-I進行、「下がるだけ進行」は、このテクニックを効果的に使用した例である。
    related_rule_ids:
      - HRM_029
      - HRM_032
  - id: META_008
    name: セブンスコードは都会へのパスポート
    description: ダイアトニックコードにセブンスの音を加える（例: C→Cmaj7, Dm→Dm7）だけで、響きに浮遊感と洗練さが生まれ、一気に都会的・現代的なサウンドになる。特にmaj7の響きはお洒落さの象徴。
    related_rule_ids:
      - HRM_002
      - HRM_010
  - id: META_009
    name: 4度圏進行の引力
    description: ルート音が4度ずつ下降（または5度ずつ上昇）していく進行は、物理的な音の倍音関係から非常に自然で強い引力を持つ。「Fly Me to the Moon進行」や「Ⅱ-Ⅴ」はこの法則に基づいている。
    related_rule_ids:
      - HRM_013
  - id: META_010
    name: I・IV・Vの機能と強進行を骨格にし、ノンダイアトニックで色付けする
    description: コード進行の重力の中心であるI（安定）とV（不安定）、それらを結ぶ強進行（4度上行）を最初に設計し、その骨格の上にセカンダリードミナント、サブドミナントマイナー、ディミニッシュ、クリシェなどの色付け要素を少量乗せると、ストーリー性と個性のバランスが取りやすい。([うちやま作曲教室][2])
    related_rule_ids:
      - HRM_011
      - HRM_017
      - HRM_012
      - HRM_014
      - HRM_015
      - HRM_013
      - HRM_016
  - id: META_011
    name: ダイナミクスで感情を増幅させる
    description: 楽曲全体の音量の強弱（ダイナミクス）や楽器の抜き差しをコントロールすることで、感情の起伏を劇的に演出できる。「落ちサビ」や「ブレイク」は、静と動のコントラストを利用した最も効果的な手法の一つである。
    related_rule_ids:
      - STR_001
  - id: META_012
    name: シンプルな構成から段階的に複雑なコードへ変形する
    description: まずは I–IV–V や I–V–VIm–IV など単純なダイアトニック進行で骨組みを作り、そこから代理コード、セカンダリードミナント、テンション付加、クリシェなどを段階的に導入していくと、破綻しにくく『おしゃれ』な進行に発展させられる。R&B風進行の作り方はこの発想の典型例。([うちやま作曲教室][7])
    related_rule_ids:
      - HRM_011
      - HRM_012
      - HRM_013
      - HRM_015
      - HRM_016
  - id: META_013
    name: J-POP黄金律は定番進行の組み合わせ
    description: 現代のヒット曲は、単一のコード進行だけでなく、「王道進行(4536)」と「J-POP王道進行(451)」を組み合わせるなど、複数の定番パターンを1つのセクションに組み込むことで、聴き馴染みの良さと展開の豊かさを両立させている。
    related_rule_ids:
      - HRM_001
      - HRM_010
      - HRM_016
  - id: META_014
    name: 構造的伏線によるキャッチーさの創出
    description: 楽曲の最もキャッチーな部分（サビメロ）をイントロで先行提示する（イントロリプライズ）ことで、聴き手の記憶にフックをかけ、曲全体への興味と期待感を高めることができる。
    related_rule_ids:
      - STR_003
  - id: META_015
    name: 自然なメロディはコードとの調和から生まれる
    description: 心地よいメロディは、コードの構成音（コードトーン）を効果的に使い、コードが変わっても共通音を保持するなど、ハーモニーとの強い関連性を持っている。半音アプローチのような非和声音は、あくまで効果的なスパイスとして機能する。
    related_rule_ids:
      - MEL_009
  - id: META_016
    name: 終止形の選択が物語の結末を決める
    description: 曲やセクションの終わり方（終止形）は、物語の結末を象徴する。力強く終わる全終止、穏やかに終わるアーメン終止、希望を残して終わるピカルディ終止など、伝えたいメッセージに合わせて終止形を選択することが重要である。
    related_rule_ids:
      - HRM_030
      - HRM_037
  - id: META_017
    name: 機能和声からの逸脱
    description: 通常のダイアトニックなコード進行のルールから逸脱する「平行移動（プラナー・ハーモニー）」のような手法は、非現実的でパワフルな、あるいは浮遊感のある独特なサウンドスケープを描き出すのに有効である。
    related_rule_ids:
      - HRM_045
  - id: META_018
    name: J-POPの多様性は定番進行の組み合わせと変形から生まれる
    description: J-POPのコード進行は、王道進行、カノン進行、丸サ進行、小室進行などのいくつかの強力な「型」をベースにしている。ヒット曲の多くは、これらの型をそのまま使うか、セカンダリードミナントや代理コード、モーダルインターチェンジを加えて巧みに変形させることで、聴き馴染みの良さと独自性を両立させている。
    related_rule_ids:
      - HRM_001
      - HRM_002
      - HRM_003
      - HRM_009
      - HRM_048