      tonality: any
      typical_genres:
        - ballad
        - J-POP
        - classical
    pattern:
      description: 強拍でコード構成音ではない音（非和声音）を演奏し、その直後に隣のコード構成音へ順次進行で解決するメロディ手法。一瞬の不協和音が解決されることで、強い情緒的な響きや切なさを生む。
      bar_span: 0.5
      beats_targeted:
        - 1
        - 3
      melodic_motion: stepwise
      special_devices:
