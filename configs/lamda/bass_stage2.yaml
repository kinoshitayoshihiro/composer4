pipeline:
  version: "stage2.bass.v2025.10"
  threshold: 40.0

score:
  axes:
    timing: 1.5                # Bassはタイミングが重要
    velocity: 1.0
    root_accuracy: 2.0         # ルート音正確性
    groove_quality: 2.0        # グルーヴ評価
    pitch_range_fit: 1.0       # 音域適合性
    articulation: 0.5
  aliases_path: "../aliases/axes.yaml"
  
  velocity:
    target_histograms_path: "configs/thresholds/velocity_bass.yaml"
    nbins: 16
    prefill_window_beats: 0.5
    normalize_dynamic_range: true
    phase_compensation: true
    weights:
      global: 0.35
      downbeat: 0.35           # Bassはダウンビート重要
      offbeat: 0.20
      prefill: 0.10
    metric_weights:
      js: 0.5
      cos: 0.5
    tempo_adaptive:
      bins:
        - max_bpm: 90
          alpha: 0.90
          downbeat_boost: 0.05
        - max_bpm: 130
          alpha: 1.0
          downbeat_boost: 0.08
        - max_bpm: null
          alpha: 1.10
          downbeat_boost: 0.10
  
  root_accuracy:
    # ルート音検出と正確性
    octave_equivalence: true    # オクターブ等価
    detect_method: "lowest_note"  # 最低音をルートとみなす
    weights:
      stability: 0.40           # 安定性(ルート音の一貫性)
      consonance: 0.30          # 協和度(他パートとの調和)
      frequency: 0.30           # 頻度(ルート音の出現頻度)
    preferred_intervals:
      root: [0]                 # ルート
      fifth: [7]                # 完全5度
      octave: [12, -12]         # オクターブ
    beat_alignment_bonus: 0.15  # ビート頭でのルート音にボーナス
  
  groove_quality:
    # グルーヴ評価
    grid_divisions: 16
    swing_detection: true
    weights:
      timing_consistency: 0.35  # タイミング一貫性
      swing_feel: 0.25          # スウィング感
      syncopation: 0.20         # シンコペーション
      density_balance: 0.20     # 音密度バランス
    swing_ratio_range:
      min: 0.52                 # 最小スウィング比
      max: 0.68                 # 最大スウィング比
    density_bands:
      - max_bpm: 90
        low: 1.5
        high: 4.0
      - max_bpm: 130
        low: 2.0
        high: 6.0
      - max_bpm: null
        low: 3.0
        high: 8.0
  
  pitch_range_fit:
    # 音域適合性チェック
    optimal_range:
      min: 28   # E1 (Bass最低音)
      max: 60   # C4 (Bass実用上限)
    extended_range:
      min: 24   # C1 (拡張最低音)
      max: 67   # G4 (拡張上限)
    weights:
      optimal_coverage: 0.50    # 最適音域カバー率
      range_concentration: 0.30  # 音域集中度
      outlier_penalty: 0.20     # 外れ値ペナルティ
    outlier_threshold_semitones: 5  # 外れ値判定閾値
  
  articulation:
    thresholds_path: "configs/thresholds/articulation_bass.yaml"
    techniques:
      - slap                    # スラップ
      - pop                     # ポップ
      - finger                  # フィンガー
      - pick                    # ピック
      - slide                   # スライド
      - hammer_on               # ハンマリング

  audio_adaptive_weights:
    enabled: false              # Bass用は後で調整
    min_confidence: 0.10
    missing_policy: "noop"

paths:
  input_dir: "."
  metadata_dir: "output/bass_metadata"
  metadata_index: "output/bass_metadata/bass_index.pkl"
  output_dir: "output/slakh/stage2/bass"
  events_parquet: "canonical_events.parquet"
  events_csv_sample: "canonical_events_sample.csv"
  loop_summary_csv: "loop_summary.csv"
  metrics_jsonl: "metrics_score.jsonl"
  retry_dir: "retries"
  summary_out: "stage2_summary.json"
  sample_event_rows: 5000

metrics:
  ghost_velocity_threshold: 35  # Bassは低め
  accent_velocity_threshold: 100
  microtiming_tolerance_ratio: 0.15  # タイミング厳格
  swing_min_pairs: 2
  min_base_step: 1
  max_breakpoints: 3
  round_digits: 4
  pitch_range:
    min: 24   # C1
    max: 67   # G4

retry_presets:
  - reason: root_accuracy
    when:
      axes_raw.root_accuracy: "< 0.30"
    action:
      preset: root_enhance
      params:
        boost_lowest_note: 1.2
        octave_snap: true
  
  - reason: groove_quality
    when:
      axes_raw.groove_quality: "< 0.35"
    action:
      preset: groove_fix
      params:
        timing_tolerance_ms: 15
        swing_detect: true
        quantize_strength: 0.3
  
  - reason: pitch_range_fit
    when:
      axes_raw.pitch_range_fit: "< 0.40"
    action:
      preset: pitch_transpose
      params:
        target_range_min: 28
        target_range_max: 60
        octave_only: true
  
  - reason: velocity
    when:
      axes_raw.velocity: "< 0.35"
    action:
      preset: vel_smooth
      params:
        vmin: 30
        vmax: 110
        compress: 0.75
