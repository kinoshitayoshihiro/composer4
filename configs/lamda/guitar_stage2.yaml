pipeline:
  version: "stage2.guitar.v2025.10"
  threshold: 40.0

score:
  axes:
    timing: 1.0
    velocity: 1.5
    arpeggio_quality: 2.0      # アルペジオパターン評価
    chord_coherence: 1.5       # コード検出・和音の美しさ
    strumming_pattern: 1.0     # ストラムパターン評価
    articulation: 0.5
  aliases_path: "../aliases/axes.yaml"
  
  velocity:
    target_histograms_path: "../thresholds/velocity_targets.yaml"  # 汎用版を使用（Guitar専用は今後作成）
    nbins: 16
    prefill_window_beats: 0.5
    normalize_dynamic_range: true
    phase_compensation: true
    weights:
      global: 0.40
      downbeat: 0.25
      offbeat: 0.20
      prefill: 0.15
    metric_weights:
      js: 0.6
      cos: 0.4
    tempo_adaptive:
      bins:
        - max_bpm: 90
          alpha: 0.85
          downbeat_boost: 0.0
        - max_bpm: 140
          alpha: 1.0
          downbeat_boost: 0.02
        - max_bpm: null
          alpha: 1.15
          downbeat_boost: 0.05
  
  arpeggio_quality:
    # アルペジオパターン評価
    min_notes: 4                # 最小音符数
    max_time_window_beats: 4.0  # 評価時間窓
    pattern_types:
      - ascending              # 上昇アルペジオ
      - descending             # 下降アルペジオ
      - alternating            # 交互パターン
    weights:
      pattern_consistency: 0.40  # パターン一貫性
      interval_regularity: 0.30  # 音程間隔の規則性
      timing_precision: 0.30     # タイミング精度
    interval_tolerance_cents: 50  # 音程許容誤差(セント)
  
  chord_coherence:
    # コード検出・和音評価
    min_simultaneous_notes: 2   # 最小同時発音数
    max_note_spread_semitones: 24  # 最大音域幅
    weights:
      consonance: 0.40          # 協和度
      voicing_quality: 0.30     # ボイシング品質
      chord_stability: 0.30     # コード安定性
    consonance_intervals:
      perfect: [0, 7, 12]       # 完全協和音程
      major: [4, 9]             # 長3度、長6度
      minor: [3, 8]             # 短3度、短6度
      dissonant: [1, 2, 6, 10, 11]  # 不協和音程
    weights_by_interval:
      perfect: 1.0
      major: 0.8
      minor: 0.7
      dissonant: 0.2
  
  strumming_pattern:
    # ストラムパターン評価
    min_notes_per_strum: 3      # 1ストラムあたり最小音符数
    max_strum_duration_ms: 100  # ストラム最大時間
    weights:
      pattern_regularity: 0.40  # パターン規則性
      velocity_consistency: 0.30  # ベロシティ一貫性
      timing_tightness: 0.30    # タイミングのタイト性
    detect_upstroke: true       # アップストローク検出
    detect_downstroke: true     # ダウンストローク検出
  
  articulation:
    thresholds_path: "../thresholds/articulation_guitar.yaml"
    techniques:
      - hammer_on               # ハンマリング
      - pull_off                # プリング
      - slide                   # スライド
      - bend                    # ベンド
      - palm_mute               # パームミュート

  audio_adaptive_weights:
    enabled: false              # Guitar用は後で調整
    min_confidence: 0.10
    missing_policy: "noop"

paths:
  input_dir: "."
  metadata_dir: "output/guitar_metadata"
  metadata_index: "output/guitar_metadata/guitar_index.pkl"
  output_dir: "output/slakh/stage2/guitar"
  events_parquet: "canonical_events.parquet"
  events_csv_sample: "canonical_events_sample.csv"
  loop_summary_csv: "loop_summary.csv"
  metrics_jsonl: "metrics_score.jsonl"
  retry_dir: "retries"
  summary_out: "stage2_summary.json"
  sample_event_rows: 5000

metrics:
  ghost_velocity_threshold: 40  # Guitarは少し低め
  accent_velocity_threshold: 95
  microtiming_tolerance_ratio: 0.25
  swing_min_pairs: 2
  min_base_step: 1
  max_breakpoints: 3
  round_digits: 4
  # pitch_range: # 今後MetricConfigで対応予定
  #   min: 40   # E2 (低音弦)
  #   max: 88   # E6 (高音弦)

retry_presets:
  - reason: arpeggio_quality
    when:
      axes_raw.arpeggio_quality: "< 0.30"
    action:
      preset: arpeggio_fix
      params:
        timing_tolerance_ms: 20
        interval_snap: true
  
  - reason: chord_coherence
    when:
      axes_raw.chord_coherence: "< 0.35"
    action:
      preset: chord_voicing_fix
      params:
        max_spread: 20
        consonance_boost: 1.2
  
  - reason: velocity
    when:
      axes_raw.velocity: "< 0.35"
    action:
      preset: vel_smooth
      params:
        vmin: 35
        vmax: 110
        compress: 0.80
