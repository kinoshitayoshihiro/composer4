# ========================================================================
# Bass Style Presets - Genre/Playing Style Presets
# ========================================================================
# Phase 11-12: 基本密度・音域
# Phase 13-19: 語彙・和声・同期・遷移・装飾・ダイナミクス・グルーヴ
# Phase 22-24: Emotion mapping・Controls・Prosody

simple:
  description: "シンプルなベースライン（ルート中心、4分・8分音符）"
  
  # Phase 11: 密度整形
  density:
    notes_per_bar:
      min: 2
      max: 8
    rest_prob: 0.2
  
  # Phase 12: 音域補正
  register:
    min_midi: 28  # E1
    max_midi: 55  # G3
  
  # Phase 13: 語彙（ピックアップ・フィル）
  vocabulary:
    pickup_prob: 0.15
    fill_prob: 0.1
    fill_min_notes: 2
    fill_max_notes: 4
  
  # Phase 14: 和声知性（根音優先）
  harmonic:
    root_weight: 0.7
    fifth_weight: 0.2
    third_weight: 0.1
    octave_collapse: true
  
  # Phase 15: クロス同期（kick同期）
  cross_sync:
    kick_sync_prob: 0.6
    kick_anticipate_prob: 0.1
  
  # Phase 16: 遷移平滑化
  transition:
    enable_crescendo: false
  
  # Phase 17: アーティキュレーション
  articulation:
    staccato_prob: 0.1
    slide_prob: 0.05
  
  # Phase 18: ダイナミクス整形
  dynamics:
    velocity_curve: flat
    min_vel: 70
    max_vel: 95
  
  # Phase 19: グルーヴマイクロタイミング
  groove:
    swing_amount: 0.0
    laidback_ms: 0.0
  
  # Phase 20: Humanize
  humanize:
    timing_ms: 8.0
    vel_sigma: 5.0
  
  # Phase 22: Emotion mapping
  emotion_map:
    density_gain: 0.5
    register_shift: 1
    staccato_bias: 0.1
    smooth_ms: 200
  
  # Phase 24: Controls
  controls:
    expression_curve: flat
    sustain_policy: off
    bend_range: 2
  
  # Phase 23: Prosody
  prosody:
    enable: false
  
  # Phase 25: Sparsify（間引き・衝突回避）
  sparsify:
    enable: false  # シンプルスタイルでは不要
  
  # Phase 27: Style Adaptation（活動度→プリセット切替）
  style_adapt:
    enable: false  # シンプルスタイルは固定
  
  # Phase 28: Export Postprocess（量子化・命名）
  export:
    quantize_ql: 0.0625  # 64分音符単位（細かく保持）
    track_split: []
    name_fmt: "{idx:02d}_Bass_{section}"

moderate:
  description: "標準的なベースライン（根音・5度・経過音）"
  
  density:
    notes_per_bar:
      min: 4
      max: 12
    rest_prob: 0.15
  
  register:
    min_midi: 28
    max_midi: 55
  
  vocabulary:
    pickup_prob: 0.25
    fill_prob: 0.2
    fill_min_notes: 3
    fill_max_notes: 6
  
  harmonic:
    root_weight: 0.6
    fifth_weight: 0.25
    third_weight: 0.15
    octave_collapse: true
  
  cross_sync:
    kick_sync_prob: 0.7
    kick_anticipate_prob: 0.15
  
  transition:
    enable_crescendo: true
    crescendo_bars: 2
    velocity_step: 3
  
  articulation:
    staccato_prob: 0.15
    slide_prob: 0.1
  
  dynamics:
    velocity_curve: linear_up
    min_vel: 65
    max_vel: 100
  
  groove:
    swing_amount: 0.0
    laidback_ms: 5.0
  
  humanize:
    timing_ms: 8.0
    vel_sigma: 5.0
  
  emotion_map:
    density_gain: 0.6
    register_shift: 2
    staccato_bias: 0.15
    smooth_ms: 180
  
  controls:
    expression_curve: linear
    sustain_policy: off
    bend_range: 2
  
  prosody:
    enable: true
    stress_boost: 8
    sibilant_duck_db: -3
    plosive_gap_ms: 40
    window_ms: 120
  
  # Phase 25: Sparsify（間引き・衝突回避）
  sparsify:
    enable: false  # 中程度では不要
  
  # Phase 27: Style Adaptation（活動度→プリセット切替）
  style_adapt:
    enable: true
    window_bars: 4
    low_high: [0.3, 0.7]  # 活動度30%-70%で simple↔moderate 補間
    order: ["simple", "moderate"]
  
  # Phase 28: Export Postprocess（量子化・命名）
  export:
    quantize_ql: 0.0625
    track_split: []
    name_fmt: "{idx:02d}_Bass_{section}"

complex:
  description: "複雑なベースライン（ウォーキングベース・ランニング）"
  
  density:
    notes_per_bar:
      min: 8
      max: 16
    rest_prob: 0.05
  
  register:
    min_midi: 28
    max_midi: 60  # C4（より広い音域）
  
  vocabulary:
    pickup_prob: 0.35
    fill_prob: 0.3
    fill_min_notes: 4
    fill_max_notes: 8
  
  harmonic:
    root_weight: 0.5
    fifth_weight: 0.25
    third_weight: 0.25
    octave_collapse: false  # オクターブ跳躍許可
  
  cross_sync:
    kick_sync_prob: 0.5  # 複雑なパターンでは同期率下げる
    kick_anticipate_prob: 0.2
  
  transition:
    enable_crescendo: true
    crescendo_bars: 2
    decrescendo_bars: 1
    velocity_step: 5
  
  articulation:
    staccato_prob: 0.2
    slide_prob: 0.15
  
  dynamics:
    velocity_curve: peak_middle
    min_vel: 60
    max_vel: 105
  
  groove:
    swing_amount: 0.05
    laidback_ms: 8.0
  
  humanize:
    timing_ms: 10.0
    vel_sigma: 6.0
  
  emotion_map:
    density_gain: 0.7
    register_shift: 3
    staccato_bias: 0.2
    smooth_ms: 150
  
  controls:
    expression_curve: arch
    sustain_policy: off
    bend_range: 2
  
  prosody:
    enable: true
    stress_boost: 10
    sibilant_duck_db: -4
    plosive_gap_ms: 50
    window_ms: 100
  
  # Phase 25: Sparsify（間引き・衝突回避）
  sparsify:
    enable: true
    keep_endpoints: true
    min_gap_ms: 80  # 80ms未満の間隔を排除（走りすぎ防止）
  
  # Phase 27: Style Adaptation（活動度→プリセット切替）
  style_adapt:
    enable: true
    window_bars: 4
    low_high: [0.4, 0.8]
    order: ["moderate", "complex"]
  
  # Phase 28: Export Postprocess（量子化・命名）
  export:
    quantize_ql: 0.125  # 8分音符単位（走りすぎを抑制）
    track_split: []
    name_fmt: "{idx:02d}_Bass_{section}"

intense:
  description: "激しいベースライン（高密度・アクセント強調）"
  
  density:
    notes_per_bar:
      min: 12
      max: 20
    rest_prob: 0.02
  
  register:
    min_midi: 28
    max_midi: 64  # E4（最広音域）
  
  vocabulary:
    pickup_prob: 0.4
    fill_prob: 0.4
    fill_min_notes: 6
    fill_max_notes: 10
  
  harmonic:
    root_weight: 0.45
    fifth_weight: 0.3
    third_weight: 0.25
    octave_collapse: false
  
  cross_sync:
    kick_sync_prob: 0.8  # 激しい同期
    kick_anticipate_prob: 0.25
  
  transition:
    enable_crescendo: true
    crescendo_bars: 1
    decrescendo_bars: 0
    velocity_step: 8
  
  articulation:
    staccato_prob: 0.25
    slide_prob: 0.2
  
  dynamics:
    velocity_curve: peak_middle
    min_vel: 70
    max_vel: 115
  
  groove:
    swing_amount: 0.08
    laidback_ms: 0.0  # プッシュ気味
    push_sixteenth_ms: -3.0
  
  humanize:
    timing_ms: 12.0
    vel_sigma: 8.0
  
  emotion_map:
    density_gain: 0.8
    register_shift: 4
    staccato_bias: 0.25
    smooth_ms: 120
  
  controls:
    expression_curve: arch
    sustain_policy: off
    bend_range: 2
  
  prosody:
    enable: true
    stress_boost: 12
    sibilant_duck_db: -5
    plosive_gap_ms: 60
    window_ms: 100
  
  # Phase 25: Sparsify（間引き・衝突回避）
  sparsify:
    enable: true
    keep_endpoints: true
    min_gap_ms: 60  # 60ms未満の間隔を排除（密集を緩和）
  
  # Phase 27: Style Adaptation（活動度→プリセット切替）
  style_adapt:
    enable: true
    window_bars: 4
    low_high: [0.5, 0.9]
    order: ["complex", "intense"]
  
  # Phase 28: Export Postprocess（量子化・命名）
  export:
    quantize_ql: 0.125  # 8分音符単位
    track_split: []
    name_fmt: "{idx:02d}_Bass_{section}"
