# vioptt_mapping.yaml - VioPTT（Violin Performance Technique Transfer）マッピング定義
# articulation_hints → VST keyswitch/CC/param への対応表

# 使い方:
# vioptt_render_stub.py で読み込んで、articulation_hints.json から制御MIDI生成
# 各VSTの実機パラメータ名/KSノートは環境差があるため、適宜調整してください

# ==============================================================================
# IK Multimedia - Miroslav Philharmonik 2 (14 Violins Multi)
# ==============================================================================
violin_miroslav_14violins:
  name: "Miroslav Philharmonik 2 - 14 Violins Multi"
  vendor: "IK Multimedia"
  type: "vst3"
  
  # Articulation Keyswitches（画面から確認した奏法）
  # Miroslav Philharmonikは通常C1-B1（MIDI 24-35）をKSに使用
  keyswitches:
    - articulation: "sustain"
      note: 24  # C1（Violins Sustain）
      threshold: 0.5  # legato_ratio >= 0.5
      
    - articulation: "detache"
      note: 25  # C#1（Violins Detache）
      threshold: 0.5  # staccato_ratio >= 0.5
      
    - articulation: "espressivo"
      note: 26  # D1（Violins Espressivo）
      threshold: 0.6  # energy_curve >= 0.6（表現力豊か）
      
    - articulation: "staccato"
      note: 27  # D#1（Violins Staccato）
      threshold: 0.5  # staccato_ratio >= 0.5
      
    - articulation: "pizzicato"
      note: 28  # E1（Violins Pizzicato）
      threshold: 0.3  # pizzicato_score >= 0.3
      
    - articulation: "tremolo"
      note: 29  # F1（Violins Tremolo）
      threshold: 0.5  # tremolo_ratio >= 0.5
      
    - articulation: "sul_pont"
      note: 30  # F#1（Violins Sul Pont）
      threshold: 0.7  # accent_score >= 0.7（明るい音色）
      
    - articulation: "legato"
      note: 31  # G1（Violins Legato）
      threshold: 0.6  # legato_ratio >= 0.6（滑らか）
  
  # CC (Control Change) Mappings
  cc_mappings:
    - param: "expression"
      cc: 11  # Expression（標準）
      source: "energy_curve"
      min: 0
      max: 127
      
    - param: "dynamics"
      cc: 1   # Modulation Wheel（動的変化用）
      source: "accent_score"
      min: 0
      max: 127
      
    - param: "vibrato_depth"
      cc: 21  # 標準CC
      source: "vibrato_depth"
      min: 0
      max: 127
      
    - param: "reverb"
      cc: 91  # Reverb Level
      source: "energy_curve"
      min: 20
      max: 80

# ==============================================================================
# Vienna Synchron String - Violin Solo
# ==============================================================================
violin_solo_synchron:
  name: "Vienna Synchron Strings - Violin Solo"
  vendor: "Vienna Symphonic Library"
  type: "vst3"
  
  # Articulation Keyswitches (MIDI Note Number)
  # Synchronは通常C0-B0（MIDI 0-11）をKSに使用
  keyswitches:
    - articulation: "legato"
      note: 0  # C0
      threshold: 0.5  # legato_ratio >= 0.5
      
    - articulation: "staccato"
      note: 1  # C#0
      threshold: 0.5  # staccato_ratio >= 0.5
      
    - articulation: "pizzicato"
      note: 2  # D0
      threshold: 0.3  # pizzicato_score >= 0.3
      
    - articulation: "tremolo"
      note: 3  # D#0
      threshold: 0.5  # tremolo_ratio >= 0.5
      
    - articulation: "spiccato"
      note: 4  # E0
      threshold: 0.4  # accent_score >= 0.4（短いアタック）
  
  # CC (Control Change) Mappings
  cc_mappings:
    - param: "expression"
      cc: 11  # Expression
      source: "energy_curve"  # articulation_hints内のキー
      min: 0
      max: 127
      
    - param: "dynamics"
      cc: 1  # Modulation Wheel（Synchronでは動的変化用）
      source: "accent_score"
      min: 0
      max: 127
      
    - param: "vibrato_depth"
      cc: 21  # VSL標準CC
      source: "vibrato_depth"
      min: 0
      max: 127

# ==============================================================================
# Ample Sound - Steel Guitar (AGS)
# ==============================================================================
guitar_steel_ample:
  name: "Ample Sound - Steel Guitar (AGS)"
  vendor: "Ample Sound"
  type: "vst3"
  
  keyswitches:
    - articulation: "sustain"
      note: 24  # C1（Ample標準KS範囲）
      threshold: 0.5
      
    - articulation: "mute"
      note: 25  # C#1
      threshold: 0.4  # staccato_ratio >= 0.4
      
    - articulation: "harmonic"
      note: 26  # D1
      threshold: 0.3
      
    - articulation: "slide"
      note: 27  # D#1
      threshold: 0.5  # legato_ratio >= 0.5（スライド表現）
      
    - articulation: "palm_mute"
      note: 28  # E1
      threshold: 0.6  # staccato_ratio >= 0.6（強めのミュート）
  
  cc_mappings:
    - param: "expression"
      cc: 11
      source: "energy_curve"
      min: 0
      max: 127
      
    - param: "attack"
      cc: 73  # Attack Time
      source: "accent_score"
      min: 0
      max: 127
      
    - param: "release"
      cc: 72  # Release Time
      source: "staccato_ratio"
      min: 0
      max: 127
      inverse: true  # staccato高い→release短い

# ==============================================================================
