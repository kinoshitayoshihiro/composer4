name: Phase 4 - Piano Transformer CI

on:
  push:
    branches: [ main, chore/ab-eval-piano-guitar-minipatch ]
    paths:
      - 'scripts/piano_*.py'
      - 'scripts/eval_*.py'
      - 'scripts/*_external_*.py'
      - 'scripts/visualize_*.py'
      - '.github/workflows/phase4-piano-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/piano_*.py'
      - 'scripts/eval_*.py'
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  syntax-check:
    name: Syntax & Import Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Python syntax check
        run: |
          python -m py_compile scripts/eval_drum_batch_stratified.py
          python -m py_compile scripts/piano_eval_generate.py
          python -m py_compile scripts/piano_train_prepare.py
          python -m py_compile scripts/piano_train.py
          python -m py_compile scripts/eval_piano_external.py
          python -m py_compile scripts/visualize_piano_trends.py
      
      - name: Import validation
        run: |
          python -c "from scripts import eval_piano_external" || echo "Warning: Import test skipped (expected in CI)"

  phase4-verification:
    name: Phase 4 Improvements Verification
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Phase 4.3 quick verification
        run: bash scripts/verify_phase43_quick.sh
      
      - name: Check documentation
        run: |
          test -f docs/PHASE_4_IMPLEMENTATION_STATUS.md
          test -f docs/PHASE_4.3_IMPROVEMENTS.md
          test -f docs/PIANO_EXTERNAL_BENCHMARK.md
          echo "✓ All documentation files present"

  external-benchmark:
    name: External Benchmark (MAESTRO Subset)
    runs-on: ubuntu-latest
    needs: syntax-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download MAESTRO subset
        run: |
          mkdir -p data/maestro_subset
          # Note: Add your MAESTRO download logic here
          # For now, skip if not configured
          echo "MAESTRO subset download skipped (configure in CI secrets)"
      
      - name: Run external benchmark
        continue-on-error: true
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -d "data/maestro_subset" ] && [ "$(find data/maestro_subset -name '*.mid' | wc -l)" -gt 0 ]; then
            bash scripts/run_piano_external_bench.sh
          else
            echo "Skipping: MAESTRO dataset not configured"
          fi
      
      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: piano-external-bench
          path: output/reports/piano_external_bench_*.json
          retention-days: 90
      
      - name: Generate trend visualization
        if: success()
        run: |
          if [ -f output/reports/piano_external_bench_history.jsonl ]; then
            python scripts/visualize_piano_trends.py \
              --history output/reports/piano_external_bench_history.jsonl \
              --out-dir output/reports/trends \
              --png
          fi
      
      - name: Upload trend reports
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: piano-trends
          path: output/reports/trends/
          retention-days: 30

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run quick integration tests
        run: bash scripts/test_phase4_quick.sh
      
      - name: Create test MIDI
        run: |
          python -c 'import pretty_midi; pm = pretty_midi.PrettyMIDI(); inst = pretty_midi.Instrument(0); note = pretty_midi.Note(100, 60, 0.0, 1.0); inst.notes.append(note); pm.instruments.append(inst); import pathlib; pathlib.Path("test_maestro").mkdir(exist_ok=True); pm.write("test_maestro/test.mid")'
      
      - name: Test external benchmark (dry run)
        run: |
          python scripts/eval_piano_external.py --maestro-dir test_maestro --out-json test_output.json --n-samples 1 --seed 42
      
      - name: Verify provenance
        run: |
          python -c 'import json; data = json.load(open("test_output.json")); assert "provenance" in data; assert "benchmark" in data; print("✓ External benchmark structure validated")'
      
      - name: Cleanup
        run: |
          rm -rf test_maestro test_output.json

  docs-lint:
    name: Documentation Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v11
        with:
          globs: 'docs/*.md'
        continue-on-error: true
      
      - name: Check for broken links
        run: |
          # Simple check for common markdown issues
          grep -r "](http" docs/ && echo "✓ External links found" || echo "No external links"
          grep -r "TODO\|FIXME" docs/ && echo "⚠ TODOs found" || echo "✓ No TODOs"
