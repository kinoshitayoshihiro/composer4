name: Benchmark Suite

on:
  # PR時に実行
  pull_request:
    branches: [main]
  
  # 手動トリガー
  workflow_dispatch:
  
  # 週次実行 (日曜 0:00 UTC)
  schedule:
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libfluidsynth-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-json-report
      
      - name: Download FluidR3_GM soundfont
        run: |
          mkdir -p assets
          if [ ! -f assets/FluidR3_GM.sf2 ]; then
            wget -O assets/FluidR3_GM.sf2 \
              https://github.com/FluidSynth/fluidsynth/raw/master/sf2/FluidR3_GM.sf2 \
              || wget -O assets/FluidR3_GM.sf2 \
              https://musical-artifacts.com/artifacts/738/FluidR3_GM.sf2
          fi
      
      - name: Generate benchmark JSON
        run: |
          python scripts/generate_benchmark_json.py
      
      - name: Run benchmark test suite
        run: |
          pytest tests/test_benchmark_suite.py -v --json-report --json-report-file=benchmark_test_report.json
      
      - name: Run single benchmark (smoke test)
        run: |
          python scripts/run_benchmark_suite.py \
            --single configs/benchmarks/pop_upbeat_simple.yaml \
            --output-dir benchmark_outputs
      
      - name: Run full benchmark suite
        id: benchmark
        continue-on-error: true
        run: |
          python scripts/run_benchmark_suite.py \
            --config multi_song_benchmark.json \
            --output-dir benchmark_outputs
      
      - name: Check benchmark results
        if: always()
        run: |
          if [ -f benchmark_outputs/benchmark_summary.json ]; then
            echo "📊 Benchmark Summary:"
            cat benchmark_outputs/benchmark_summary.json | python -m json.tool
            
            # Parse pass rate
            PASS_RATE=$(cat benchmark_outputs/benchmark_summary.json | \
              python -c "import sys, json; print(json.load(sys.stdin)['pass_rate'])")
            
            echo "Pass Rate: ${PASS_RATE}%"
            
            # Fail if pass rate < 80%
            if (( $(echo "$PASS_RATE < 80" | bc -l) )); then
              echo "❌ Benchmark pass rate too low: ${PASS_RATE}% < 80%"
              exit 1
            fi
          else
            echo "⚠️ Benchmark summary not found"
            exit 1
          fi
      
      - name: Detect regressions
        if: always() && github.event_name == 'pull_request'
        run: |
          # TODO: Compare with baseline (main branch)
          echo "🔍 Regression detection (placeholder)"
          echo "Comparing with main branch baseline..."
      
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark_outputs/
            multi_song_benchmark.json
            benchmark_test_report.json
          retention-days: 30
      
      - name: Upload MIDI files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-midi-${{ github.sha }}
          path: benchmark_outputs/*.mid
          retention-days: 7
      
      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let summaryText = '## 📊 Benchmark Suite Results\n\n';
            
            try {
              const summary = JSON.parse(
                fs.readFileSync('benchmark_outputs/benchmark_summary.json', 'utf8')
              );
              
              summaryText += `- **Total Benchmarks**: ${summary.total_benchmarks}\n`;
              summaryText += `- **Passed**: ${summary.passed} ✅\n`;
              summaryText += `- **Failed**: ${summary.failed} ❌\n`;
              summaryText += `- **Pass Rate**: ${summary.pass_rate.toFixed(1)}%\n`;
              summaryText += `- **Duration**: ${summary.total_duration_sec.toFixed(1)}s\n\n`;
              
              if (summary.failed > 0) {
                summaryText += '### ❌ Failed Benchmarks:\n\n';
                summary.results
                  .filter(r => r.status !== 'PASS')
                  .forEach(r => {
                    summaryText += `- ${r.yaml}: ${r.error || r.status}\n`;
                  });
              }
            } catch (e) {
              summaryText += '⚠️ Could not read benchmark summary\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summaryText
            });
      
      - name: Generate benchmark badge
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          PASS_RATE=$(cat benchmark_outputs/benchmark_summary.json | \
            python -c "import sys, json; print(int(json.load(sys.stdin)['pass_rate']))")
          
          COLOR="red"
          if [ $PASS_RATE -ge 90 ]; then
            COLOR="brightgreen"
          elif [ $PASS_RATE -ge 70 ]; then
            COLOR="yellow"
          fi
          
          echo "Benchmark pass rate: ${PASS_RATE}% (color: ${COLOR})"
          
          # TODO: Update badge in README or create shields.io endpoint
      
      - name: Job summary
        if: always()
        run: |
          echo "### 📊 Benchmark Suite Summary" >> $GITHUB_STEP_SUMMARY
          
          if [ -f benchmark_outputs/benchmark_summary.json ]; then
            cat benchmark_outputs/benchmark_summary.json | python -c "
            import sys, json
            data = json.load(sys.stdin)
            print(f\"- Total: {data['total_benchmarks']}\")
            print(f\"- Passed: {data['passed']} ✅\")
            print(f\"- Failed: {data['failed']} ❌\")
            print(f\"- Pass Rate: {data['pass_rate']:.1f}%\")
            print(f\"- Duration: {data['total_duration_sec']:.1f}s\")
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Benchmark summary not available" >> $GITHUB_STEP_SUMMARY
          fi
