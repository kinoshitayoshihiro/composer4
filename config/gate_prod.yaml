# KPI Gate Configuration for Guitar/Bass/Piano/Drums
# Phase 21/22: Production-Ready Quality Gates
# Phase 26: ML Expansion - Guitar/Bass/Piano ML Integration

# ========================================
# Guitar ML Configuration (Phase 26)
# ========================================
guitar_ml:
  enabled: true  # Guitar ML推論有効化
  
  # ML Model Settings
  model_path: "ml/stage2_guitar_v3_ml.pickle"
  safe_kit_path: "config/safe_kit_guitar.yaml"
  
  # Safety Thresholds
  safety:
    min_proba: 0.15   # Top-1確率最小値（これ以下でSafe-Kit発火）
    min_margin: 0.10  # Top-1/Top-2マージン最小値
  
  # Auto-Recovery (Phase 26で有効化)
  auto_recovery:
    enabled: true
    window_size: 64          # 監視ウィンドウサイズ（bars）
    max_violations: 10       # 許容違反回数
    cooldown_bars: 16        # クールダウン期間（bars）
    recovery_action: "safe_kit_fallback"
    notify_on_recovery: true
    collect_metrics: true
    metrics_prefix: "guitar_auto_recovery"
  
  # KPI Gates（既存設定を維持）
  kpi_gates:
    accent_score_min: 0.65
    chord_fit_min: 0.60
    density_abs_max: 1.0
    ml_used_min: 0.70

# ========================================
# Bass ML Configuration (Phase 26)
# ========================================
bass_ml:
  enabled: true  # Bass ML推論有効化
  
  # ML Model Settings
  model_path: "ml/stage2_bass_v3_ml.pickle"
  safe_kit_path: "config/safe_kit_bass.yaml"
  
  # Safety Thresholds
  safety:
    min_proba: 0.15   # Top-1確率最小値（これ以下でSafe-Kit発火）
    min_margin: 0.10  # Top-1/Top-2マージン最小値
  
  # Auto-Recovery (Phase 26で有効化)
  auto_recovery:
    enabled: true
    window_size: 64          # 監視ウィンドウサイズ（bars）
    max_violations: 10       # 許容違反回数
    cooldown_bars: 16        # クールダウン期間（bars）
    recovery_action: "safe_kit_fallback"
    notify_on_recovery: true
    collect_metrics: true
    metrics_prefix: "bass_auto_recovery"
  
  # KPI Gates（既存設定を維持）
  kpi_gates:
    root_hit_rate_min: 0.85  # ルート音命中率
    chord_fit_min: 0.70      # コード適合度
    density_abs_max: 2.0     # 目標密度との絶対差
    ml_used_min: 0.70

# ========================================
# Piano ML Configuration (Phase 26)
# ========================================
piano_ml:
  enabled: true  # Piano ML推論有効化
  
  # ML Model Settings
  model_path: "ml/stage2_piano_v3_ml.pickle"
  safe_kit_path: "config/safe_kit_piano.yaml"
  
  # Safety Thresholds
  safety:
    min_proba: 0.15   # Top-1確率最小値（これ以下でSafe-Kit発火）
    min_margin: 0.10  # Top-1/Top-2マージン最小値
  
  # Auto-Recovery (Phase 26で有効化)
  auto_recovery:
    enabled: true
    window_size: 64          # 監視ウィンドウサイズ（bars）
    max_violations: 10       # 許容違反回数
    cooldown_bars: 16        # クールダウン期間（bars）
    recovery_action: "safe_kit_fallback"
    notify_on_recovery: true
    collect_metrics: true
    metrics_prefix: "piano_auto_recovery"
  
  # KPI Gates（既存設定を維持）
  kpi_gates:
    chord_fit_min: 0.75              # コード適合度
    voicing_quality_min: 0.70        # ボイシング品質
    voice_leading_smooth_min: 0.65   # ボイスリーディング滑らかさ
    ml_used_min: 0.70

# ========================================
# Hard Gates (Must Pass for Deployment)
# ========================================
kpi_gate:
  # Accent Score: 拍アクセント一致度（位相最適化後のコサイン類似度）
  accent_score_min: 0.65  # デフォルト閾値
  
  # Chord Fit: コードトーン/テンション命中率
  chord_fit_min: 0.60  # デフォルト閾値
  
  # Density Absolute Deviation: 目標密度からのズレ（QL単位）
  density_abs_max: 1.0
  
  # ML Used Rate: ML推薦採用率（v3は常に1.0）
  ml_used_min: 0.70
  
  # ========================================
  # セクション別オーバーライド（攻め/守りの切替）
  # ========================================
  per_section:
    chorus:
      accent_score_min: 0.70  # Chorusは高水準要求（聴きどころ）
      chord_fit_min: 0.65
      density_abs_max: 0.8
    
    verse:
      accent_score_min: 0.65  # Verseは標準
      chord_fit_min: 0.60
      density_abs_max: 1.0
    
    bridge:
      accent_score_min: 0.68  # Bridgeは変化重視
      chord_fit_min: 0.62
      density_abs_max: 0.9
    
    intro:
      accent_score_min: 0.60  # Introは柔軟に
      chord_fit_min: 0.55
      density_abs_max: 1.2
    
    outro:
      accent_score_min: 0.60  # Outroも柔軟
      chord_fit_min: 0.55
      density_abs_max: 1.2
    
    "pre-chorus":
      accent_score_min: 0.67  # Pre-Chorusは準重要
      chord_fit_min: 0.63
      density_abs_max: 0.9

# ========================================
# Section-Specific Weights (評価サマリー用)
# ========================================
weights:
  # Overall評価の重み配分
  accent_overall: 0.4
  accent_chorus: 0.6  # Chorusは重視
  
  chord_fit_overall: 0.3
  density_overall: 0.3

# ========================================
# Chord Fit Weights (v3.1計算用係数)
# ========================================
chord_fit:
  # セクション別の重み係数（強拍/弱拍/ベースルート/衝突ペナルティ）
  weights_by_section:
    Chorus:
      beat_strong: 0.40      # 強拍のコードトーン一致度
      beat_weak: 0.20        # 弱拍のコードトーン一致度
      bass_root_bonus: 0.10  # ベース音がルート音に一致
      clash_penalty: -0.30   # 半音衝突ペナルティ
    
    Verse:
      beat_strong: 0.30      # Verseは強拍重視度を少し下げる
      beat_weak: 0.25        # 弱拍を少し上げてバランス型
      bass_root_bonus: 0.05  # ベースルートボーナスは控えめ
      clash_penalty: -0.25   # 衝突ペナルティも少し緩和
    
    Bridge:
      beat_strong: 0.35      # Bridge標準
      beat_weak: 0.20
      bass_root_bonus: 0.10
      clash_penalty: -0.30
    
    Intro:
      beat_strong: 0.30      # Intro柔軟
      beat_weak: 0.25
      bass_root_bonus: 0.05
      clash_penalty: -0.20   # 衝突を許容
    
    Outro:
      beat_strong: 0.30      # Outro柔軟
      beat_weak: 0.25
      bass_root_bonus: 0.05
      clash_penalty: -0.20
    
    "Pre-Chorus":
      beat_strong: 0.38      # Pre-Chorus準重要
      beat_weak: 0.22
      bass_root_bonus: 0.08
      clash_penalty: -0.28

# ========================================
# Latency SLO (Service Level Objectives)
# ========================================
latency_slo:
  # Warning閾値: 通常運用時の上限
  p95_ms_warn: 100
  
  # Critical閾値: フォールバックトリガー
  p95_ms_crit: 150
  
  # Target: 最適化後の目標レイテンシ
  p95_ms_target: 10

# ========================================
# Fallback Logic (v3 → Safe-Kit切替)
# ========================================
fallback:
  # 評価ウィンドウ（小節数）
  window_bars: 32
  
  # 違反閾値（window内でmin_breach_bars以上の違反でフォールバック発火）
  min_breach_bars: 6
  
  # Cooldown期間（切替後の最短滞留期間、小節数）
  cooldown_bars: 16
  
  # 条件（いずれかを満たせばフォールバック）
  conditions:
    - name: "AccentScoreDegradation"
      metric: "accent_delta"
      threshold: -0.05  # v3がv1より5pt以上劣化
      
    - name: "HighLatency"
      metric: "latency_p95_ms"
      threshold: 150.0  # p95が150ms超過
      
    - name: "HighErrorRate"
      metric: "error_rate"
      threshold: 0.01  # エラー率1%超過

# ========================================
# V3 Filter Settings (Phase 24.3)
# ========================================
v3_filter:
  # グローバル設定
  enabled: true           # filter_v3_only（top1_proba=1.0のみ推薦）
  min_proba: 0.15         # 絶対KPI閾値：top1_proba下限
  min_margin: 0.10        # 絶対KPI閾値：proba_margin下限
  
  # セクション別オーバーライド（Chorusだけ厳格化等）
  per_section_override:
    chorus:
      min_margin: 0.12    # Chorusは余裕を持たせる（top2との差を大きく）
    intro:
      min_proba: 0.12     # Introは少し緩く
      min_margin: 0.08
    outro:
      min_proba: 0.12
      min_margin: 0.08
  
  # 楽器別オーバーライド（任意）
  per_instrument:
    bass:
      min_proba: 0.18     # Bassは精度重視（ルート音の安定性）
    piano:
      min_proba: 0.15
      min_margin: 0.12    # Pianoはハーモニー重視
    strings:
      min_proba: 0.14     # Stringsは少し緩く（パッド系）

# ========================================
# Instrument-Specific Settings
# ========================================
instruments:
  guitar:
    kpi_weights:
      accent: 0.4
      chord_fit: 0.35
      density: 0.25
    
    additional_metrics:
      - name: "voicing_spread"
        description: "ボイシングの音域幅（オクターブ単位）"
        min: 0.8
        max: 2.5
  
  bass:
    kpi_weights:
      downbeat_hit: 0.5  # ダウンビート命中率（最重要）
      root_alignment: 0.3  # ルート音整合率
      density: 0.2
    
    additional_metrics:
      - name: "downbeat_hit_rate"
        description: "ダウンビート（1拍目・3拍目）でのルート音演奏率"
        min: 0.70
  
  strings:
    kpi_weights:
      chord_fit: 0.4
      voice_leading: 0.35  # ボイスリーディング（音の移動距離）
      density: 0.25
    
    additional_metrics:
      - name: "voice_leading_smoothness"
        description: "前小節からの平均音程移動距離（半音単位）"
        max: 4.0  # 4半音以内の滑らかな移動

# ========================================
# Monitoring & Alerting
# ========================================
monitoring:
  # Prometheus exporter設定
  prometheus:
    port: 9109
    path: "/metrics"
    refresh_interval_sec: 30
  
  # Slack通知
  slack:
    webhook_url: ""  # 環境変数SLACK_WEBHOOK_URLで設定
    notification_triggers:
      - "fallback_triggered"
      - "kpi_gate_failed"
      - "high_error_rate"
  
  # Grafana Dashboard
  grafana:
    dashboard_id: "shadow-testing-guitar-v3"
    panel_refresh_sec: 30
    alert_evaluation_interval_sec: 60

# ========================================
# Data Retention & Logging
# ========================================
logging:
  # CSV詳細ログ
  csv_log_path: "data/shadow_logs/shadow_eval.csv"
  max_rows: 10000  # ローテーション閾値
  
  # JSON集計レポート
  json_report_path: "data/shadow_logs/shadow_report_{timestamp}.json"
  report_interval_bars: 100  # 100小節ごとにレポート生成
  
  # Inference Metadata（生成MIDIへの追記）
  embed_metadata: true
  metadata_fields:
    - model_version
    - model_sha256
    - selector_type
    - top1_proba
    - accent_score
    - chord_fit
    - safety_fallback

# ========================================
# Canary Deployment Settings
# ========================================
canary:
  # 段階的展開
  stages:
    - name: "canary_10"
      v3_ratio: 0.10
      duration_songs: 10
      auto_promote: false
    
    - name: "canary_25"
      v3_ratio: 0.25
      duration_songs: 25
      auto_promote: true
      auto_promote_conditions:
        - "accent_score_mean >= 0.70"
        - "chord_fit_mean >= 0.65"
        - "error_rate < 0.005"
    
    - name: "canary_50"
      v3_ratio: 0.50
      duration_songs: 50
      auto_promote: true
      auto_promote_conditions:
        - "accent_score_mean >= 0.72"
        - "win_rate >= 0.75"
    
    - name: "full_rollout"
      v3_ratio: 1.00
      duration_songs: 100

# ========================================
# Model Registry & Versioning
# ========================================
model_registry:
  v3:
    model_path: "data/patterns/stage2_guitar_v3_fixed.pickle"
    sha256: "auto"  # 起動時に自動計算
    version: "v3.2.1"
    training_date: "2025-10-15"
    selector_config:
      threshold: 0.0
      w_proba: 1.00
      rerank_enabled: false
  
  v1:
    model_path: "data/patterns/stage2_guitar.pickle"
    sha256: "auto"
    version: "v1.0.0"
    type: "rule_based"
  
  safe_kit:
    # フォールバック時の緊急代替パターン
    enabled: true
    patterns:
      - "open_chord_basic"
      - "downbeat_root_only"
      - "suspended_pad"

# ========================================
# Drums KPI Gates (Phase 25: Rhythm AI)
# ========================================
drums:
  kpi_gates:
    # ダウンビート命中率（キック）: 1拍目/3拍目へのキック配置率
    kick_downbeat_rate_min: 0.80
    
    # バックビート整合率（スネア）: 4/4で2&4拍目、6/8相応位置
    snare_backbeat_acc_min: 0.85
    
    # ハイハット密度許容誤差: 目標密度との絶対差の中央値（QL単位）
    hat_density_abs_max: 2.0
    
    # フィル配置妥当性: 小節跨ぎ・休符崩壊なし
    fill_placement_valid_min: 0.95
    
    # ML使用率（v3直採用率）
    ml_used_min: 0.90
    
    # レイテンシ（p95）
    latency_p95_ms_max: 100
  
  safety:
    # Top-1確率最小値（低い場合はSafe-Kit発火）
    min_proba: 0.15
    
    # Top-1/Top-2マージン最小値（低い場合はSafe-Kit発火）
    min_margin: 0.10
  
  traffic:
    # Shadow/Canary/Prod分配比率
    shadow_ratio: 0.05
    canary_ratio: 0.10
    prod_ratio: 0.85
  
  auto_recovery:
    # Auto-Recovery機能（Phase 25.3で有効化）
    enabled: true  # KPI違反時の自動復旧を有効化
    
    # 移動窓パラメータ
    window_size: 64          # 監視ウィンドウサイズ（bars）
    max_violations: 10       # 許容違反回数
    cooldown_bars: 16        # クールダウン期間（bars）
    
    # Recovery動作
    recovery_action: "safe_kit_fallback"  # Safe-Kitへフォールバック
    notify_on_recovery: true               # Recovery時にアラート送信
    
    # メトリクス収集
    collect_metrics: true
    metrics_prefix: "drums_auto_recovery"
  
  # セクション別オーバーライド（攻め/守りの切替）
  per_section:
    chorus:
      kick_downbeat_rate_min: 0.85  # Chorusは安定重視
      snare_backbeat_acc_min: 0.90
      hat_density_abs_max: 1.5
    
    verse:
      kick_downbeat_rate_min: 0.80  # Verse標準
      snare_backbeat_acc_min: 0.85
      hat_density_abs_max: 2.0
    
    bridge:
      kick_downbeat_rate_min: 0.75  # Bridge変化許容
      snare_backbeat_acc_min: 0.80
      hat_density_abs_max: 2.5
    
    intro:
      kick_downbeat_rate_min: 0.70  # Intro柔軟
      snare_backbeat_acc_min: 0.75
      hat_density_abs_max: 3.0
    
    outro:
      kick_downbeat_rate_min: 0.70  # Outro柔軟
      snare_backbeat_acc_min: 0.75
      hat_density_abs_max: 3.0
