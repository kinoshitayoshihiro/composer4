    NEG: {min: -1.0, max: -0.3}
    NEU: {min: -0.3, max: 0.3}
    POS: {min: 0.3, max: 1.0}
  arousal:
    LOW: {min: 0.0, max: 0.35}
    MID: {min: 0.35, max: 0.7}
    HIGH: {min: 0.7, max: 1.0}
  defaults:
