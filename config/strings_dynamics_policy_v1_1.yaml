  emotion_profile_json: "plans/emotion_profile.json"
  bars_parquet: "plans/bars.parquet"

outputs:
  per_bar_dynamics_json: "plans/strings_dynamics_plan.json"

section_normalization:
  mapping:
    intro: INTRO
    verse: VERSE
    verse_a: VERSE
    verse_b: VERSE
    prechorus: PRE_CHORUS
    pre_chorus: PRE_CHORUS
    chorus: CHORUS
    chorus_a: CHORUS
    chorus_b: CHORUS
    bridge: BRIDGE
    solo: SOLO
    interlude: INTERLUDE
    breakdown: BREAKDOWN
    climax: CLIMAX
    outro: OUTRO
    ambient: AMBIENT_PART
    ambient_part: AMBIENT_PART
    unknown: UNKNOWN
  priority:
    - CLIMAX
    - CHORUS
    - PRE_CHORUS
    - SOLO
    - BRIDGE
    - VERSE
    - BREAKDOWN
    - INTERLUDE
    - INTRO
    - OUTRO
    - AMBIENT_PART
    - UNKNOWN

emotion_buckets:
