axis_modifiers:
  valence_NEG:
    playfulness_add: -0.02
    articulation_preference: [TREMOLO, LEGATO]
    register_bias: LOW
  valence_POS:
    playfulness_add: 0.03
    articulation_preference: [MARCATO, LEGATO]
    register_bias: HIGH
  arousal_HIGH:
    countermelody_add: 0.05
    swell_probability_add: 0.06

low_tension_guard:
  enable: true
  condition:
    energy_max: 0.35
  enforce:
    countermelody_density: 0.02
    ostinato_density: 0.04
    swell_probability: 0.03
    playfulness_bias_max: 0.06

section_edge_rules:
  enable: true
  edge_window_bars: 1
  boost:
    crescendo_bias_add_by_arousal:
      LOW: 0.10
      MID: 0.20
      HIGH: 0.30
    swell_probability_add_by_arousal:
      LOW: 0.05
      MID: 0.08
      HIGH: 0.12

clamp:
  pad_density:
    min: 0.10
    max: 0.85
  ostinato_density:
    min: 0.00
    max: 0.40
  countermelody_density:
    min: 0.00
    max: 0.40
  swell_probability:
    min: 0.00
    max: 0.40
  crescendo_bias:
    min: 0.00
    max: 0.60
  playfulness_bias:
    min: 0.00
    max: 0.18
