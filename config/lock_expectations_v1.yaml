schema_version: 1
description: Expected Drum/Bass lockness ranges by style_id, section, emotion_tag.
  Used for QA gating and auto-tuning of Kick×Bass sync and accent cohesion.
metrics_definition:
  lock_score: 0..1 weighted composite of kick_bass_sync_rate and accent_alignment_rate
  kick_bass_sync_rate: Share of kick hits that have a bass-onset within the tolerance
    window
  accent_alignment_rate: Share of downbeat/strong-beat accents aligned between kick
    and bass
  default_tolerance_ms: 25
weights:
  kick_bass_sync_rate: 0.65
  accent_alignment_rate: 0.35
defaults:
  lock_score_range:
  - 0.45
  - 0.75
  kick_bass_sync_rate_range:
  - 0.5
  - 0.8
  accent_alignment_rate_range:
  - 0.4
  - 0.7
