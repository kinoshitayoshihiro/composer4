schema_version: '1.0'

# Magenta Fill QA — Phase 4 装飾レイヤ
magenta:
  defaults:
    # Maximum ratio of Magenta-generated events to total events
    max_event_ratio: 0.25
    
    # Maximum consecutive bars with Magenta fills
    max_consecutive_bars: 4
    
    # Minimum rest between Magenta fills (bars)
    min_rest_bars: 2
    
    # Pitch outlier tolerance (semitones from guide tones)
    max_pitch_outlier: 12
    
    # Velocity range
    velocity_range:
      - 40
      - 110
    
    # Event density (events per beat)
    max_density: 8.0
  
  section_overrides:
    intro:
      max_event_ratio: 0.35  # More tolerance in intro
    verse:
      max_event_ratio: 0.20  # Less in verse (clarity)
    chorus:
      max_event_ratio: 0.30  # Moderate in chorus
    outro:
      max_consecutive_bars: 8  # More tolerance in outro

piano:
  defaults:
    chord_tone_rate:
      min: 0.7
    hand_separation:
      min: 0.6
    velocity_std:
      range:
      - 15
      - 25
    bar_violation_rate:
      max: 0.02
    notes_per_bar:
      range:
      - 8
      - 16
  style_overrides:
    ballad:
      velocity_std:
        range:
        - 10
        - 22
      notes_per_bar:
        range:
        - 6
        - 14
    ostinato:
      hand_separation:
        min: 0.5
      notes_per_bar:
        range:
        - 10
        - 20
  tempo_overrides:
    slow:
      bar_violation_rate:
        max: 0.03
    fast:
      bar_violation_rate:
        max: 0.03
  section_overrides:
    Chorus:
      velocity_std:
        range:
        - 18
        - 28
guitar:
  defaults:
    strum_consistency:
      min: 0.75
    bar_violation_rate:
      max: 0.03
    notes_per_bar:
      range:
      - 8
      - 20
    velocity_std:
      range:
      - 12
      - 28
  style_overrides:
    shuffle:
      strum_consistency:
        min: 0.72
    arpeggio:
      notes_per_bar:
        range:
        - 10
        - 28
bass:
  defaults:
    root_or_chord_tone_rate:
      min: 0.7
    leap_rate:
      max: 0.2
    max_leap_semitones:
      max: 12
    grid_off_std_ms:
      max: 18
    notes_per_bar:
      range:
      - 4
      - 12
    velocity_std:
      range:
      - 10
      - 22
  style_overrides:
    walking:
      notes_per_bar:
        range:
        - 8
        - 16
      root_or_chord_tone_rate:
        min: 0.6
    ballad:
      grid_off_std_ms:
        max: 22
strings:
  defaults:
    legato_connection_rate:
      min: 0.6
    leap_rate:
      max: 0.15
    max_leap_semitones:
      max: 12
    chord_spread_semitones:
      max: 24
    velocity_std:
      min: 12
    bar_violation_rate:
      max: 0.02
  style_overrides:
    staccato:
      legato_connection_rate:
        min: 0.3
      velocity_std:
        min: 8
drums:
  defaults:
    grid_off_std_ms:
      max: 20
    kick_on_beat_rate:
      min: 0.65
    snare_backbeat_rate:
      min: 0.6
    hihat_density_per_bar:
      range:
      - 8
      - 24
    velocity_std_kick:
      range:
      - 6
      - 14
    velocity_std_snare:
      range:
      - 8
      - 18
    velocity_std_hihat:
      range:
      - 4
      - 12
    bar_violation_rate:
      max: 0.02
  style_overrides:
    shuffle:
      grid_off_std_ms:
        max: 24
      hihat_density_per_bar:
        range:
        - 6
        - 20
    half_time:
      snare_backbeat_rate:
        min: 0.45
  label_overrides:
    aggressive_halftime:
      grid_off_std_ms:
        max: 18
      kick_on_beat_rate:
        min: 0.7
      snare_backbeat_rate:
        min: 0.5
      velocity_std_kick:
        range:
        - 8
        - 16
      velocity_std_snare:
        range:
        - 10
        - 20
      hihat_density_per_bar:
        range:
        - 6
        - 18
    sparkle_shuffle:
      grid_off_std_ms:
        max: 28
      kick_on_beat_rate:
        min: 0.55
      snare_backbeat_rate:
        min: 0.5
      velocity_std_kick:
        range:
        - 4
        - 10
      velocity_std_snare:
        range:
        - 6
        - 14
      hihat_density_per_bar:
        range:
        - 10
        - 28
    intense_energy:
      grid_off_std_ms:
        max: 15
      kick_on_beat_rate:
        min: 0.75
      snare_backbeat_rate:
        min: 0.65
      velocity_std_kick:
        range:
        - 10
        - 18
      velocity_std_snare:
        range:
        - 12
        - 22
      hihat_density_per_bar:
        range:
        - 12
        - 28
    melancholic_slow:
      grid_off_std_ms:
        max: 25
      kick_on_beat_rate:
        min: 0.5
      snare_backbeat_rate:
        min: 0.4
      velocity_std_kick:
        range:
        - 4
        - 10
      velocity_std_snare:
        range:
        - 6
        - 12
      hihat_density_per_bar:
        range:
        - 4
        - 12
    calm_ambient:
      grid_off_std_ms:
        max: 30
      kick_on_beat_rate:
        min: 0.4
      snare_backbeat_rate:
        min: 0.3
      velocity_std_kick:
        range:
        - 3
        - 8
      velocity_std_snare:
        range:
        - 4
        - 10
      hihat_density_per_bar:
        range:
        - 2
        - 8
metadata:
  created: '2025-10-14'
  author: Composer2-3 Team
  description: Quality gates for instrument generators (v1.0)
  reference: Based on Phase 4.3 external benchmark and Phase 4.5 guitar validation
