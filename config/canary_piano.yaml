# Canary Deployment Configuration: Piano ML Inference
# Phase: 26.3 (Piano ML基盤展開)
# Created: 2025-10-28

# Canary展開スケジュール（4週間段階的ロールアウト）
deployment:
  instrument: "piano"
  phase: "26.3"
  schedule:
    week_1:
      name: "Shadow Deployment (5% logging)"
      traffic_split:
        shadow: 0.05
        production: 0.95
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: false  # Logging only
        auto_recovery_enabled: false
      success_criteria:
        - "Shadow KPI ≥ Production KPI"
        - "ML usage ≥ 70%"
        - "No critical errors"
    
    week_2:
      name: "Canary 5% (serving)"
      traffic_split:
        shadow: 0.05
        canary: 0.05
        production: 0.90
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: true
        auto_recovery_enabled: true
      success_criteria:
        - "Canary KPI ≥ Production KPI"
        - "Latency p95 < 120ms"  # Piano is more complex
        - "Error rate < 1%"
        - "ML usage ≥ 70%"
    
    week_3:
      name: "Canary 20% (serving)"
      traffic_split:
        canary: 0.20
        production: 0.80
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: true
        auto_recovery_enabled: true
      success_criteria:
        - "Canary KPI ≥ Production KPI"
        - "Statistical significance (1000+ samples, 95% confidence)"
        - "Latency p95 < 120ms"
        - "Error rate < 1%"
    
    week_4:
      name: "Production 100% (full rollout)"
      traffic_split:
        production: 1.00
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: true
        auto_recovery_enabled: true
      success_criteria:
        - "All KPIs maintained"
        - "No rollback events for 7 days"

# KPI監視対象（Piano固有）
kpi_gates:
  chord_fit:
    min_threshold: 0.75
    description: "コード適合度（拡張コード対応）"
    alert_on_violation: true
  
  voicing_quality:
    min_threshold: 0.70
    description: "ボイシング品質（音域分布、音の密度）"
    alert_on_violation: true
  
  voice_leading_smooth:
    min_threshold: 0.65
    description: "ボイスリーディング滑らかさ（半音階移動最小化）"
    alert_on_violation: true
  
  ml_used:
    min_threshold: 0.70
    description: "ML使用率（Safe-Kit以外）"
    alert_on_violation: true

# Safety閾値（ML推論）
safety:
  min_proba: 0.15   # Top-1確率最小値（これ以下でSafe-Kit発火）
  min_margin: 0.10  # Top-1/Top-2マージン最小値（これ以下でSafe-Kit発火）

# Auto-Recovery設定
auto_recovery:
  enabled: true
  window_size: 64          # 監視ウィンドウサイズ（bars）
  max_violations: 10       # 許容違反回数
  cooldown_bars: 16        # クールダウン期間（bars）
  recovery_action: "safe_kit_fallback"
  notify_on_recovery: true
  collect_metrics: true
  metrics_prefix: "piano_auto_recovery"

# Prometheus Alerting Rules
alerting:
  rules:
    - name: "PianoKPIViolation"
      expr: "piano_chord_fit < 0.75 OR piano_voicing_quality < 0.70 OR piano_voice_leading_smooth < 0.65"
      for: "5m"
      severity: "warning"
      annotations:
        summary: "Piano KPI violation detected"
        description: "Piano KPI out of range. Check chord_fit/voicing_quality/voice_leading_smooth."
    
    - name: "PianoMLUsageLow"
      expr: "rate(piano_ml_used_total[15m]) < 0.70"
      for: "10m"
      severity: "warning"
      annotations:
        summary: "Piano ML usage below 70%"
        description: "Too many Safe-Kit fallbacks. Check ML model performance."
    
    - name: "PianoLatencyHigh"
      expr: "histogram_quantile(0.95, piano_recommend_duration_seconds_bucket) > 0.120"
      for: "5m"
      severity: "critical"
      annotations:
        summary: "Piano recommendation latency p95 > 120ms"
        description: "Performance degradation detected. Investigate bottlenecks (Voicing/Texture complexity)."
    
    - name: "PianoAutoRecoveryFrequent"
      expr: "rate(piano_auto_recovery_triggered_total[30m]) > 0.05"
      for: "15m"
      severity: "warning"
      annotations:
        summary: "Piano Auto-Recovery triggered frequently"
        description: "Check KPI violation patterns. Model retraining may be required."
    
    - name: "PianoSafeKitFallbackHigh"
      expr: "rate(piano_safe_kit_fallback_total[5m]) > 0.10"
      for: "10m"
      severity: "warning"
      annotations:
        summary: "Piano Safe-Kit fallback rate > 10%"
        description: "ML model confidence too low. Review min_proba/min_margin thresholds."
    
    - name: "PianoVoicingMismatch"
      expr: "rate(piano_voicing_mismatch_total[10m]) > 0.05"
      for: "10m"
      severity: "info"
      annotations:
        summary: "Piano voicing style mismatch detected"
        description: "Check voicing_style parameter (close/open/spread/rootless)."
    
    - name: "PianoTextureMismatch"
      expr: "rate(piano_texture_mismatch_total[10m]) > 0.05"
      for: "10m"
      severity: "info"
      annotations:
        summary: "Piano texture mismatch detected"
        description: "Check texture parameter (block/arpeggio/broken/stride)."

# Grafana Dashboard Panels（Piano固有）
grafana:
  dashboard_url: "http://grafana.company.com/d/piano-ml-canary"
  panels:
    - name: "Piano Chord Fit (Canary vs Production)"
      query: "piano_chord_fit{deployment=\"canary\"} vs piano_chord_fit{deployment=\"production\"}"
      threshold: 0.75
    
    - name: "Piano Voicing Quality (Canary vs Production)"
      query: "piano_voicing_quality{deployment=\"canary\"} vs piano_voicing_quality{deployment=\"production\"}"
      threshold: 0.70
    
    - name: "Piano Voice Leading Smooth (Canary vs Production)"
      query: "piano_voice_leading_smooth{deployment=\"canary\"} vs piano_voice_leading_smooth{deployment=\"production\"}"
      threshold: 0.65
    
    - name: "Piano ML Usage Rate"
      query: "rate(piano_ml_used_total[5m])"
      threshold: 0.70
    
    - name: "Piano Voicing Style Distribution"
      query: |
        rate(piano_voicing_style_total{style="close"}[5m]),
        rate(piano_voicing_style_total{style="open"}[5m]),
        rate(piano_voicing_style_total{style="spread"}[5m]),
        rate(piano_voicing_style_total{style="rootless"}[5m])
      threshold: "N/A (monitoring only)"
    
    - name: "Piano Texture Distribution"
      query: |
        rate(piano_texture_total{texture="block"}[5m]),
        rate(piano_texture_total{texture="arpeggio"}[5m]),
        rate(piano_texture_total{texture="broken"}[5m]),
        rate(piano_texture_total{texture="stride"}[5m])
      threshold: "N/A (monitoring only)"
    
    - name: "Piano Recommendation Latency (p50, p95, p99)"
      query: |
        histogram_quantile(0.50, piano_recommend_duration_seconds_bucket),
        histogram_quantile(0.95, piano_recommend_duration_seconds_bucket),
        histogram_quantile(0.99, piano_recommend_duration_seconds_bucket)
      threshold: "p95 < 120ms"
    
    - name: "Piano Auto-Recovery Events"
      query: "rate(piano_auto_recovery_triggered_total[30m])"
      threshold: "< 0.05 events/sec"
    
    - name: "Piano Safe-Kit Fallback Rate"
      query: "rate(piano_safe_kit_fallback_total[5m])"
      threshold: "< 0.10 (10%)"
    
    - name: "Piano Chord Type Distribution (Extended Chords)"
      query: |
        rate(piano_chord_type_total{type="maj"}[5m]),
        rate(piano_chord_type_total{type="min"}[5m]),
        rate(piano_chord_type_total{type="7"}[5m]),
        rate(piano_chord_type_total{type="maj7"}[5m]),
        rate(piano_chord_type_total{type="min7"}[5m]),
        rate(piano_chord_type_total{type="9"}[5m]),
        rate(piano_chord_type_total{type="11"}[5m]),
        rate(piano_chord_type_total{type="13"}[5m])
      threshold: "N/A (monitoring only)"

# Rollback計画
rollback:
  trigger_conditions:
    - "Canary KPI < Production KPI (95% confidence, 1000+ samples)"
    - "Error rate > 5%"
    - "Latency p95 > 180ms"
    - "Manual trigger by SRE"
  
  procedure:
    - step: 1
      action: "Disable ml_serving_enabled flag"
      rollback_to: "Production (Rule-based)"
    
    - step: 2
      action: "Notify engineering team via PagerDuty"
      priority: "P2"
    
    - step: 3
      action: "Collect debug logs and ML model diagnostics"
      retention: "30 days"
    
    - step: 4
      action: "Post-mortem within 48 hours"
      template: "docs/postmortem_template.md"

# テストデータセット（Canary検証用）
test_dataset:
  name: "piano_canary_test_v1"
  size: 5000
  sections:
    - Chorus: 2000
    - Verse: 1500
    - Bridge: 800
    - Intro: 400
    - Outro: 300
  chord_distribution:
    - maj: 0.25
    - min: 0.20
    - 7: 0.15
    - maj7: 0.15
    - min7: 0.10
    - sus4: 0.05
    - dim: 0.03
    - aug: 0.02
    - "9": 0.02
    - "11": 0.02
    - "13": 0.01
  voicing_distribution:
    - close: 0.40
    - open: 0.30
    - spread: 0.20
    - rootless: 0.10
  texture_distribution:
    - block: 0.35
    - arpeggio: 0.25
    - broken: 0.25
    - stride: 0.15
  tempo_range: [50, 180]
  energy_range: [0.0, 1.0]

# Success Metrics（最終評価）
success_metrics:
  kpi_improvement:
    target: "Canary KPI ≥ Production KPI (95% confidence)"
    measurement_period: "Week 3-4"
  
  ml_usage:
    target: "≥ 70%"
    measurement_period: "All weeks"
  
  latency:
    target: "p95 < 120ms"
    measurement_period: "Week 2-4"
  
  error_rate:
    target: "< 1%"
    measurement_period: "All weeks"
  
  safe_kit_fallback_rate:
    target: "< 10%"
    measurement_period: "Week 2-4"
  
  auto_recovery_rate:
    target: "< 5% (of total generations)"
    measurement_period: "Week 2-4"
  
  voicing_coverage:
    target: "All 4 voicing styles (close/open/spread/rootless) supported"
    measurement_period: "Week 2-4"
  
  texture_coverage:
    target: "All 4 textures (block/arpeggio/broken/stride) supported"
    measurement_period: "Week 2-4"
  
  extended_chord_support:
    target: "11 chord types (maj/min/7/maj7/min7/sus4/dim/aug/9/11/13) supported"
    measurement_period: "Week 2-4"

# Notes
notes: |
  - Drumsの成功（Phase 25）を踏まえ、同様の4週間Canaryスケジュールを採用
  - Piano固有のKPI（chord_fit ≥ 0.75, voicing_quality ≥ 0.70, voice_leading_smooth ≥ 0.65）に注目
  - Voicing Style対応（close/open/spread/rootless）により多様なボイシングを実現
  - Texture対応（block/arpeggio/broken/stride）により多様なピアノテクスチャを実現
  - Extended Chord対応（11種類: maj/min/7/maj7/min7/sus4/dim/aug/9/11/13）
  - Safe-Kitは6種類（Close Block, Open Voicing, Arpeggio, Broken Chord, Rootless Voicing, Stride Piano）
  - ML Model: ml/stage2_piano_v3_ml.pickle（XGBoost/LogReg）
  - Safe-Kit Config: config/safe_kit_piano.yaml
  - Latency閾値は120ms（Guitar/Bass: 100ms）に設定（Voicing/Texture計算の複雑さを考慮）
  - Voicing Mismatch/Texture Mismatchアラートを追加（パラメータ検証）
