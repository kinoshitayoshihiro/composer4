version: "1.1"
policy_id: "BASS_DYN_V1_1"
instrument: "BASS"

inputs:
  sections_json: "plans/sections.json"
  emotion_profile_json: "plans/emotion_profile.json"
  bars_parquet: "plans/bars.parquet"

outputs:
  per_bar_dynamics_json: "plans/bass_dynamics_plan.json"

section_normalization:
  mapping:
    intro: INTRO
    verse: VERSE
    verse_a: VERSE
    verse_b: VERSE
    prechorus: PRE_CHORUS
    pre_chorus: PRE_CHORUS
    chorus: CHORUS
    chorus_a: CHORUS
    chorus_b: CHORUS
    bridge: BRIDGE
    solo: SOLO
    interlude: INTERLUDE
    breakdown: BREAKDOWN
    climax: CLIMAX
    outro: OUTRO
    unknown: UNKNOWN
  priority:
    - CLIMAX
    - CHORUS
    - PRE_CHORUS
    - SOLO
    - BRIDGE
    - VERSE
    - BREAKDOWN
    - INTERLUDE
    - INTRO
    - OUTRO
    - UNKNOWN

emotion_buckets:
  valence:
    NEG: {min: -1.0, max: -0.3}
    NEU: {min: -0.3, max: 0.3}
    POS: {min: 0.3, max: 1.0}
  arousal:
    LOW: {min: 0.0, max: 0.35}
    MID: {min: 0.35, max: 0.7}
    HIGH: {min: 0.7, max: 1.0}
  defaults:
    valence: NEU
    arousal: MID

defaults:
  role: FOUNDATION
  root_anchor_bias: 0.70
  pedal_point_bias: 0.20
  passing_tone_density: 0.08
  octave_motion_bias: 0.06
  syncopation_bias: 0.08
  register_bias: LOW_MID
  articulation: LEGATO
  playfulness_bias: 0.06

