axis_modifiers:
  valence_NEG:
    playfulness_add: -0.02
    pedal_point_add: 0.08
    syncopation_add: -0.03
  valence_POS:
    playfulness_add: 0.03
    pedal_point_add: -0.06
    octave_motion_add: 0.06
  arousal_HIGH:
    passing_tone_add: 0.05
    syncopation_add: 0.05

low_tension_guard:
  enable: true
  condition:
    energy_max: 0.35
  enforce:
    passing_tone_density: 0.03
    octave_motion_bias: 0.02
    syncopation_bias: 0.03
    pedal_point_bias: 0.35
    playfulness_bias_max: 0.06

section_edge_rules:
  enable: true
  edge_window_bars: 1
  boost:
    passing_tone_add_by_arousal:
      LOW: 0.03
      MID: 0.06
      HIGH: 0.10
    syncopation_add_by_arousal:
      LOW: 0.01
      MID: 0.03
      HIGH: 0.05

clamp:
  root_anchor_bias:
    min: 0.40
    max: 0.90
  pedal_point_bias:
    min: 0.00
    max: 0.60
  passing_tone_density:
    min: 0.00
    max: 0.35
  octave_motion_bias:
    min: 0.00
    max: 0.35
  syncopation_bias:
    min: 0.00
    max: 0.30
  playfulness_bias:
    min: 0.00
    max: 0.16
