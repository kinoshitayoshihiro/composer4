# Canary Deployment Configuration: Guitar ML Inference
# Phase: 26.1 (Guitar ML基盤展開)
# Created: 2025-10-28

# Canary展開スケジュール（4週間段階的ロールアウト）
deployment:
  instrument: "guitar"
  phase: "26.1"
  schedule:
    week_1:
      name: "Shadow Deployment (5% logging)"
      traffic_split:
        shadow: 0.05
        production: 0.95
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: false  # Logging only
        auto_recovery_enabled: false
      success_criteria:
        - "Shadow KPI ≥ Production KPI"
        - "ML usage ≥ 70%"
        - "No critical errors"
    
    week_2:
      name: "Canary 5% (serving)"
      traffic_split:
        shadow: 0.05
        canary: 0.05
        production: 0.90
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: true
        auto_recovery_enabled: true
      success_criteria:
        - "Canary KPI ≥ Production KPI"
        - "Latency p95 < 100ms"
        - "Error rate < 1%"
        - "ML usage ≥ 70%"
    
    week_3:
      name: "Canary 20% (serving)"
      traffic_split:
        canary: 0.20
        production: 0.80
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: true
        auto_recovery_enabled: true
      success_criteria:
        - "Canary KPI ≥ Production KPI"
        - "Statistical significance (1000+ samples, 95% confidence)"
        - "Latency p95 < 100ms"
        - "Error rate < 1%"
    
    week_4:
      name: "Production 100% (full rollout)"
      traffic_split:
        production: 1.00
      feature_flags:
        ml_inference_enabled: true
        ml_serving_enabled: true
        auto_recovery_enabled: true
      success_criteria:
        - "All KPIs maintained"
        - "No rollback events for 7 days"

# KPI監視対象（Guitar固有）
kpi_gates:
  accent_score:
    min_threshold: 0.65
    description: "拍アクセント一致度"
    alert_on_violation: true
  
  chord_fit:
    min_threshold: 0.60
    description: "コード適合度"
    alert_on_violation: true
  
  density_abs:
    max_threshold: 1.0
    description: "目標密度との絶対差"
    alert_on_violation: true
  
  ml_used:
    min_threshold: 0.70
    description: "ML使用率（Safe-Kit以外）"
    alert_on_violation: true

# Safety閾値（ML推論）
safety:
  min_proba: 0.15   # Top-1確率最小値（これ以下でSafe-Kit発火）
  min_margin: 0.10  # Top-1/Top-2マージン最小値（これ以下でSafe-Kit発火）

# Auto-Recovery設定
auto_recovery:
  enabled: true
  window_size: 64          # 監視ウィンドウサイズ（bars）
  max_violations: 10       # 許容違反回数
  cooldown_bars: 16        # クールダウン期間（bars）
  recovery_action: "safe_kit_fallback"
  notify_on_recovery: true
  collect_metrics: true
  metrics_prefix: "guitar_auto_recovery"

# Prometheus Alerting Rules
alerting:
  rules:
    - name: "GuitarKPIViolation"
      expr: "guitar_accent_score < 0.65 OR guitar_chord_fit < 0.60 OR guitar_density_abs > 1.0"
      for: "5m"
      severity: "warning"
      annotations:
        summary: "Guitar KPI violation detected"
        description: "Guitar KPI out of range. Check accent_score/chord_fit/density."
    
    - name: "GuitarMLUsageLow"
      expr: "rate(guitar_ml_used_total[15m]) < 0.70"
      for: "10m"
      severity: "warning"
      annotations:
        summary: "Guitar ML usage below 70%"
        description: "Too many Safe-Kit fallbacks. Check ML model performance."
    
    - name: "GuitarLatencyHigh"
      expr: "histogram_quantile(0.95, guitar_recommend_duration_seconds_bucket) > 0.100"
      for: "5m"
      severity: "critical"
      annotations:
        summary: "Guitar recommendation latency p95 > 100ms"
        description: "Performance degradation detected. Investigate bottlenecks."
    
    - name: "GuitarAutoRecoveryFrequent"
      expr: "rate(guitar_auto_recovery_triggered_total[30m]) > 0.05"
      for: "15m"
      severity: "warning"
      annotations:
        summary: "Guitar Auto-Recovery triggered frequently"
        description: "Check KPI violation patterns. Model retraining may be required."
    
    - name: "GuitarSafeKitFallbackHigh"
      expr: "rate(guitar_safe_kit_fallback_total[5m]) > 0.10"
      for: "10m"
      severity: "warning"
      annotations:
        summary: "Guitar Safe-Kit fallback rate > 10%"
        description: "ML model confidence too low. Review min_proba/min_margin thresholds."

# Grafana Dashboard Panels（Guitar固有）
grafana:
  dashboard_url: "http://grafana.company.com/d/guitar-ml-canary"
  panels:
    - name: "Guitar Accent Score (Canary vs Production)"
      query: "guitar_accent_score{deployment=\"canary\"} vs guitar_accent_score{deployment=\"production\"}"
      threshold: 0.65
    
    - name: "Guitar Chord Fit (Canary vs Production)"
      query: "guitar_chord_fit{deployment=\"canary\"} vs guitar_chord_fit{deployment=\"production\"}"
      threshold: 0.60
    
    - name: "Guitar Density (Canary vs Production)"
      query: "guitar_density_actual{deployment=\"canary\"} vs guitar_density_actual{deployment=\"production\"}"
      threshold: "target ± 1.0"
    
    - name: "Guitar ML Usage Rate"
      query: "rate(guitar_ml_used_total[5m])"
      threshold: 0.70
    
    - name: "Guitar Recommendation Latency (p50, p95, p99)"
      query: |
        histogram_quantile(0.50, guitar_recommend_duration_seconds_bucket),
        histogram_quantile(0.95, guitar_recommend_duration_seconds_bucket),
        histogram_quantile(0.99, guitar_recommend_duration_seconds_bucket)
      threshold: "p95 < 100ms"
    
    - name: "Guitar Auto-Recovery Events"
      query: "rate(guitar_auto_recovery_triggered_total[30m])"
      threshold: "< 0.05 events/sec"
    
    - name: "Guitar Safe-Kit Fallback Rate"
      query: "rate(guitar_safe_kit_fallback_total[5m])"
      threshold: "< 0.10 (10%)"

# Rollback計画
rollback:
  trigger_conditions:
    - "Canary KPI < Production KPI (95% confidence, 1000+ samples)"
    - "Error rate > 5%"
    - "Latency p95 > 150ms"
    - "Manual trigger by SRE"
  
  procedure:
    - step: 1
      action: "Disable ml_serving_enabled flag"
      rollback_to: "Production (Rule-based)"
    
    - step: 2
      action: "Notify engineering team via PagerDuty"
      priority: "P2"
    
    - step: 3
      action: "Collect debug logs and ML model diagnostics"
      retention: "30 days"
    
    - step: 4
      action: "Post-mortem within 48 hours"
      template: "docs/postmortem_template.md"

# テストデータセット（Canary検証用）
test_dataset:
  name: "guitar_canary_test_v1"
  size: 5000
  sections:
    - Chorus: 2000
    - Verse: 1500
    - Bridge: 800
    - Intro: 400
    - Outro: 300
  chord_distribution:
    - maj: 0.40
    - min: 0.30
    - 7: 0.15
    - maj7: 0.10
    - sus4: 0.03
    - dim: 0.01
    - aug: 0.01
  tempo_range: [60, 180]
  energy_range: [0.0, 1.0]

# Success Metrics（最終評価）
success_metrics:
  kpi_improvement:
    target: "Canary KPI ≥ Production KPI (95% confidence)"
    measurement_period: "Week 3-4"
  
  ml_usage:
    target: "≥ 70%"
    measurement_period: "All weeks"
  
  latency:
    target: "p95 < 100ms"
    measurement_period: "Week 2-4"
  
  error_rate:
    target: "< 1%"
    measurement_period: "All weeks"
  
  safe_kit_fallback_rate:
    target: "< 10%"
    measurement_period: "Week 2-4"
  
  auto_recovery_rate:
    target: "< 5% (of total generations)"
    measurement_period: "Week 2-4"

# Notes
notes: |
  - Drumsの成功（Phase 25）を踏まえ、同様の4週間Canaryスケジュールを採用
  - Guitar固有のKPI（accent_score, chord_fit）に注目
  - Safe-Kitは5種類（Open Chord, Power Chord, Arpeggio, Suspended Pad, Downbeat Root Only）
  - ML Model: ml/stage2_guitar_v3_ml.pickle（XGBoost/LogReg）
  - Safe-Kit Config: config/safe_kit_guitar.yaml
