# ============================================================================
# デバッグ用設定（効果を強調）
# ============================================================================

debug_balance_strong:
  xinst_balance:
    vs_bass:
      enable: true
      threshold: 0.5    # 低閾値（頻繁に譲歩）
      vel_cut: 12       # 大きく減衰

debug_voice_leading_strict:
  voice_leading:
    enable: true
    max_leap: 3         # 短3度（3半音）まで（非常に保守的）
