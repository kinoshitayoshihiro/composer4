"""
# 手動設定例
activity_manual = {
    "bass": [(0, 0.85), (1, 0.3), (2, 0.7), (3, 0.5)],
    "guitar": [(0, 0.5), (1, 0.9), (2, 0.4), (3, 0.6)]
}

# 自動計算例（将来実装）
def calculate_activity(part, bar_range):
    activity = []
    for bar in bar_range:
        notes_in_bar = [n for n in part.notes if n.bar == bar]
        level = min(1.0, len(notes_in_bar) / 16.0)  # 16音符で飽和
        activity.append((bar, level))
    return activity

activity_auto = {
    "bass": calculate_activity(bass_part, range(4)),
    "guitar": calculate_activity(guitar_part, range(4))
}
